<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>취업 현황 GIS (Cloud)</title>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<style>
  :root{--c:#00695c;--c2:#004d40;--line:#cbd5e1;--bg:#eef2f1;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:13px;color:#1f2937}
  body{display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:9px 14px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;flex:0 0 auto}
  header h1{font-size:16px;margin:0;font-weight:600}
  .authbar{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px}
  .authbar input{padding:5px 7px;border:1px solid rgba(255,255,255,.5);border-radius:5px;font-size:12px;background:rgba(255,255,255,.92)}
  .pill{background:rgba(255,255,255,.15);padding:4px 9px;border-radius:12px}
  .btn{background:var(--c);color:#fff;border:none;padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px}
  .btn:hover{background:var(--c2)} .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.g{background:#fff;color:var(--c);border:1px solid var(--c)}
  a.home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.18);padding:4px 11px;border-radius:12px}
  .body{flex:1;display:flex;min-height:0}
  .side{width:330px;min-width:330px;border-right:1px solid var(--line);background:#fafbfb;overflow:auto;padding:12px}
  #map{flex:1;min-width:0}
  .banner{background:#fff8e1;border-bottom:1px solid #ffe082;padding:7px 14px;font-size:12px;color:#795548;display:none;flex:0 0 auto}
  .grp{margin-bottom:14px}
  .grp h3{margin:0 0 7px;font-size:13px;color:var(--c2)}
  .slider{margin-bottom:9px}
  .slider .lab{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:2px}
  .slider input[type=range]{width:100%}
  .checks{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}
  .checks label{display:flex;align-items:center;gap:6px;font-size:12px;padding:1px 0}
  .checks .sw{width:11px;height:11px;border-radius:2px;border:1px solid #888}
  table.st{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:10px}
  table.st td,table.st th{border:1px solid var(--line);padding:3px 6px}
  table.st th{background:#00695c;color:#fff;font-weight:600}
  table.st .cathead th{cursor:pointer}
  table.st td.c{text-align:center;width:24px} table.st td.n{text-align:right;width:42px;color:#444}
  table.st td.l{display:flex;align-items:center;gap:5px}
  table.st tr.off td.l{color:#aaa} table.st tr.off td.n{color:#bbb}
  table.st .avg{font-size:11px;color:#00695c;text-align:center}
  table.st input{margin:0;vertical-align:middle}
  .jgm{cursor:pointer}                       /* position은 MapLibre가 제어 — 건드리지 않음 */
  .jgm-in{position:relative;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .jgm svg{display:block}
  .jgm .cnt{position:absolute;top:-5px;right:-6px;background:#222;color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 4px;border:1px solid #fff}
  .maplibregl-popup-content{font-size:12px;line-height:1.5}
  /* 연봉 색 범례 — 색이 무엇을 뜻하는지 지도 위에서 바로 읽히게 (2026-09-13) */
  #map{position:relative}
  #salaryLegend{position:absolute;left:10px;bottom:26px;z-index:2;background:rgba(255,255,255,.92);
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px;color:#374151;
    box-shadow:0 2px 8px rgba(15,23,42,.12)}
  #salaryLegend b{display:block;font-size:11px;font-weight:600;margin-bottom:4px;color:#1f2937}
  #salaryLegend .ramp{width:132px;height:9px;border-radius:5px;border:1px solid rgba(15,23,42,.15);
    background:linear-gradient(90deg,rgb(68,1,84) 0%,rgb(72,40,120) 11%,rgb(62,74,137) 22%,rgb(49,104,142) 33%,rgb(38,130,142) 44%,rgb(31,158,137) 56%,rgb(53,183,121) 67%,rgb(110,206,88) 78%,rgb(181,222,43) 89%,rgb(253,231,37) 100%)}
  #salaryLegend .ax{display:flex;justify-content:space-between;margin-top:2px;color:#6b7280;font-size:10px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:10px;padding:18px;width:520px;max-width:94vw;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 12px;font-size:16px;color:var(--c2)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid label{display:flex;flex-direction:column;font-size:11px;color:#555;gap:3px}
  .grid label.full{grid-column:1/3}
  .grid input,.grid select{padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:13px}
  .err{color:#c62828;font-size:12px;margin-top:6px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;z-index:99}
  .toast.show{opacity:1}
  .hint{font-size:11px;color:#888;margin-top:3px}
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← 홈</a>
  <h1>금오공대 소재디자인공학과 취업 현황 GIS</h1>
  <div class="authbar" id="authbar"></div>
</header>
<div class="banner" id="banner"></div>

<div class="body">
  <aside class="side">
    <div class="grp">
      <button class="btn g" id="btnAdd" onclick="openEdit(null)" disabled style="width:100%">＋ 취업 사례 추가</button>
    </div>
    <div class="grp">
      <h3>분류별 현황 <span id="statCount" style="font-weight:400;color:#777"></span>
        <span style="font-weight:400;font-size:10px;color:#999">· 체크로 지도 필터</span></h3>
      <div id="statTables"></div>
    </div>
  </aside>
  <div id="map">
    <div id="salaryLegend"><b>연봉(만원)</b><div class="ramp"></div>
      <div class="ax"><span>0</span><span>2000</span><span>4000+</span></div></div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal-bg" id="modalBg"><div class="modal">
  <h2 id="modalTitle">취업 사례 추가</h2>
  <input type="hidden" id="eId">
  <div class="grid">
    <label>학과<input id="eDpt"></label>
    <label>학번(연도)<input id="eYear" type="number"></label>
    <label>이름<input id="eName"></label>
    <label>학점<input id="eGrade" type="number" step="0.01"></label>
    <label>토익<input id="eToeic" type="number"></label>
    <label>업종<select id="eType"></select></label>
    <label class="full">회사명<input id="eOffice"></label>

    <label class="full">주소<input id="eAddr"></label>
    <label>경도(Lng)<input id="eLng" type="number" step="any"></label>
    <label>위도(Lat)<input id="eLat" type="number" step="any"></label>
  </div>

  <div class="err" id="editErr"></div>
  <div class="modal-actions">
    <button class="btn" style="background:#c62828" id="eDelete" onclick="deleteJob()">삭제</button>
    <button class="btn g" onclick="closeEdit()">취소</button>
    <button class="btn" id="eSave" onclick="saveJob()">저장</button>
  </div>
</div></div>

<!-- 설정 모달 -->
<div class="modal-bg" id="cfgBg"><div class="modal" style="width:520px">
  <h2>Supabase 연결 설정</h2>
  <div style="display:flex;flex-direction:column;gap:10px">
    <label style="font-size:11px;color:#555">Project URL<input id="cfgUrl" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px"></label>
    <label style="font-size:11px;color:#555">anon public key<input id="cfgKey" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px"></label>
  </div>
  <div class="err" id="cfgErr"></div>
  <div class="modal-actions"><button class="btn" onclick="saveConfig()">저장 후 연결</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ===== Supabase (UPJUK과 같은 프로젝트, 공유 로그인) ===== */
function normUrl(u){return (u||"").trim().replace(/\/+$/,"").replace(/\/rest\/v1$/i,"").replace(/\/auth\/v1$/i,"").replace(/\/+$/,"");}
const BAKED_URL="https://ijutjirouxgqcldjyhma.supabase.co";
const BAKED_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqdXRqaXJvdXhncWNsZGp5aG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDk4MDAsImV4cCI6MjA5Nzk4NTgwMH0.gIAwf6a2oY-DkTXaf5eM2L4ROMCKim5WsevGfjol7tE";
/* 쿠키·사이트 데이터가 막힌 브라우저에서는 localStorage 접근이 예외를 던진다. 그 예외가
   최상단에서 터지면 지도도 목록도 못 뜨므로 전부 감싼다 (2026-09-13). */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
let CFG={url:normUrl(lsGet("cfms_url")||BAKED_URL),key:(lsGet("cfms_key")||BAKED_KEY).trim()};
let SESSION=null;
try{SESSION=JSON.parse(lsGet("cfms_session")||"null");}catch(e){}
function isIn(){return !!(SESSION&&SESSION.access_token);}
function authHeaders(u){const h={apikey:CFG.key,"Content-Type":"application/json"};h.Authorization="Bearer "+((u&&isIn())?SESSION.access_token:CFG.key);return h;}
async function refreshToken(){
  if(!(SESSION&&SESSION.refresh_token)) return false;
  try{
    const rr=await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',
      {method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESSION.refresh_token})});
    if(!rr.ok) return false;
    const d=await rr.json();
    SESSION={access_token:d.access_token,refresh_token:d.refresh_token||SESSION.refresh_token,email:SESSION.email};
    lsSet("cfms_session",JSON.stringify(SESSION));
    return true;
  }catch(e){ return false; }
}
async function api(path,opts={}){
  let r=await fetch(CFG.url+path,opts);
  if(r.status===401 && isIn() && opts.headers && /Bearer/.test(opts.headers.Authorization||"")){
    if(await refreshToken()){
      opts.headers.Authorization="Bearer "+SESSION.access_token;
      r=await fetch(CFG.url+path,opts);
    }else{
      toast("세션이 만료되었습니다. 다시 로그인해 주세요.");logout();
    }
  }
  if(!r.ok)throw new Error(r.status+" "+await r.text());const t=await r.text();return t?JSON.parse(t):null;}

/* ===== 데이터 ===== */
let JOBS=[], TYPES=[], map=null, mapReady=false;
async function loadAll(){
  try{
    // 로그인 시 실명 테이블, 비로그인 시 이름 마스킹된 공개 뷰
    const jt=isIn()?'jobgis_jobs':'jobgis_jobs_public';
    const [j,t]=await Promise.all([
      api('/rest/v1/'+jt+'?select=*',{headers:authHeaders(isIn())}),
      api('/rest/v1/jobgis_office_types?select=*',{headers:authHeaders(false)})
    ]);
    JOBS=j; TYPES=t;
    document.getElementById("banner").style.display="none";
    initUI();
  }catch(e){showBanner("불러오기 실패. 스키마/설정 확인. ("+e.message.slice(0,120)+")");}
}
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};

/* ===== 연봉 → 색 (viridis) =====
   2026-09-13: 파랑→빨강 무지개(원본 FloatToRainbow 이식)를 걷어냈다. 무지개는 화려한 만큼
   값의 순서를 눈으로 읽을 수 없고(초록 구간이 넓고 청록에서 튄다), 원색이 많아 지도 바탕과
   싸운다. viridis 는 밝기가 단조 증가라 낮은 연봉 → 높은 연봉이 어두움 → 밝음으로 그대로
   읽히고 색각 이상에서도 순서가 유지된다. Polyscope 의 기본 colormap 이기도 하다.
   값 범위(0~4100)는 예전과 같게 두었다 — 필터에 따라 범위가 움직이면 같은 회사가 화면마다
   다른 색이 되어 비교가 무너진다. */
const VIRIDIS=[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[110,206,88],[181,222,43],[253,231,37]];
function hx(n){return ("0"+Math.round(n).toString(16)).slice(-2);}
function rgbAt(t){
  t=Math.max(0,Math.min(1,t));
  const s=t*(VIRIDIS.length-1), i=Math.min(VIRIDIS.length-2,Math.floor(s)), f=s-i;
  const a=VIRIDIS[i], b=VIRIDIS[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
const SALARY_MAX=4100;
function salaryColor(v){const c=rgbAt((Math.max(0,Math.min(SALARY_MAX,v||0)))/SALARY_MAX);return "#"+hx(c[0])+hx(c[1])+hx(c[2]);}

/* ===== UI 초기화 ===== */
/* ===== 분류(통계=필터) 정의 ===== */
const CATS=[
  {key:"toeic",title:"토익",buckets:["900+","800+","700+","600+","500+","<500"],
    band:j=>{const t=num(j.sStudentTOEIC);return t==null?"<500":t>=900?"900+":t>=800?"800+":t>=700?"700+":t>=600?"600+":t>=500?"500+":"<500";},
    val:j=>num(j.sStudentTOEIC)},
  {key:"grade",title:"학점",buckets:["4.0+","3.5+","3.0+","2.5+","<2.5"],
    band:j=>{const g=num(j.sStudentGrade);return g==null?"<2.5":g>=4?"4.0+":g>=3.5?"3.5+":g>=3?"3.0+":g>=2.5?"2.5+":"<2.5";},
    val:j=>num(j.sStudentGrade)},
  {key:"salary",title:"연봉(만원)",buckets:["4000+","3500+","3000+","2500+","<2500"],
    band:j=>{const s=num(j.sOfficeSalary);return s==null?"<2500":s>=4000?"4000+":s>=3500?"3500+":s>=3000?"3000+":s>=2500?"2500+":"<2500";},
    val:j=>num(j.sOfficeSalary)},
  {key:"type",title:"업종",buckets:[],icon:true,
    band:j=>j.sOfficeType||"(미지정)", val:()=>null}
];
const CATBY={}; CATS.forEach(c=>CATBY[c.key]=c);
const CHECKED={};

function initUI(){
  symbolByType={}; TYPES.forEach(t=>{if(t.sOfficeType)symbolByType[t.sOfficeType]=t.sOfficeSymbol;});
  const tNames=[...new Set([...TYPES.map(t=>t.sOfficeType), ...JOBS.map(j=>j.sOfficeType)].filter(Boolean))];
  CATBY.type.buckets=tNames.concat(JOBS.some(j=>!j.sOfficeType)?["(미지정)"]:[]);
  document.getElementById("eType").innerHTML=tNames.map(n=>`<option>${esc(n)}</option>`).join("");
  CATS.forEach(c=>{CHECKED[c.key]=new Set(c.buckets);});
  document.getElementById("statTables").innerHTML=CATS.map(c=>`<table class="st" id="st_${c.key}"></table>`).join("");
  renderAuth();
  if(!mapReady) initMap(); else apply();
}

/* ===== 필터(체크된 버킷만 통과, 분류 간 AND) ===== */
function passExcept(j,exceptKey){
  for(const c of CATS){ if(c.key===exceptKey) continue;
    if(!CHECKED[c.key].has(c.band(j))) return false; }
  return true;
}
function filtered(){ return JOBS.filter(j=>passExcept(j,null)); }
function apply(){ if(!mapReady)return; rebuildMarkers(filtered()); renderStats(); }
function tBucket(key,b){ const s=CHECKED[key]; if(s.has(b))s.delete(b); else s.add(b); apply(); }
function tCat(key){ const c=CATBY[key],s=CHECKED[key]; if(c.buckets.every(b=>s.has(b))) s.clear(); else c.buckets.forEach(b=>s.add(b)); apply(); }

/* ===== 통계 표 = 필터 (행마다 체크박스) ===== */
function renderStats(){
  document.getElementById("statCount").textContent="("+filtered().length+"건)";
  const cur=filtered();
  for(const c of CATS){
    const base=JOBS.filter(j=>passExcept(j,c.key));   // 다른 분류 적용 후 facet 카운트
    const cnt={}; c.buckets.forEach(b=>cnt[b]=0);
    base.forEach(j=>{const b=c.band(j); if(cnt[b]!=null)cnt[b]++;});
    const allOn=c.buckets.length>0 && c.buckets.every(b=>CHECKED[c.key].has(b));
    let h=`<tr class="cathead"><th class="c"><input type="checkbox" ${allOn?"checked":""} onclick="tCat('${c.key}')"></th>`+
          `<th>${esc(c.title)}</th><th class="n">건수</th></tr>`;
    let sum=0;
    for(const b of c.buckets){
      const on=CHECKED[c.key].has(b); sum+=cnt[b];
      const ic=c.icon?`<svg viewBox="0 -960 960 960" width="15" height="15" style="flex:0 0 15px"><path d="${ICON[symbolByType[b]||'_']||ICON._}" fill="#555"/></svg>`:"";
      h+=`<tr class="${on?"":"off"}"><td class="c"><input type="checkbox" ${on?"checked":""} onclick="tBucket('${c.key}','${(""+b).replace(/'/g,"\\'")}')"></td>`+
         `<td class="l">${ic}${esc(b)}</td><td class="n">${cnt[b]}</td></tr>`;
    }
    let avgRow="";
    if(c.val){ const vs=cur.map(c.val).filter(x=>x!=null);
      if(vs.length){ const a=vs.reduce((p,q)=>p+q,0)/vs.length;
        avgRow=`<tr><td></td><td class="avg" colspan="2">표시 ${cur.length}건 평균 ${Math.round(a*100)/100}</td></tr>`; } }
    h+=`<tr><td></td><th>합계</th><th class="n">${sum}</th></tr>`+avgRow;
    document.getElementById("st_"+c.key).innerHTML=h;
  }
}

/* ===== 지도 ===== */
function initMap(){
  map=new maplibregl.Map({container:"map",
    style:{version:8,sources:{osm:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap contributors"}},
      layers:[{id:"osm",type:"raster",source:"osm",
        /* 2026-09-13: OSM 기본 타일은 도로·녹지·건물이 모두 원색이라 그 위에 얹은 마커와
           채도가 맞붙는다. 타일을 바꾸지 않고(출처·약관 그대로) 채도만 내려 바탕으로
           물러나게 한다. 마커 색이 유일한 강한 색이 되도록. */
        paint:{"raster-saturation":-0.9,"raster-contrast":-0.12,"raster-brightness-min":0.06,"raster-brightness-max":0.97}}]},
    center:[127.885,36.238],zoom:6});
  map.addControl(new maplibregl.NavigationControl());
  map.on("load",()=>{
    mapReady=true; apply();
    // 국내 좌표 기준으로 초기 화면 맞춤(해외 근무지는 줌아웃하면 보임)
    const kor=filtered().map(j=>[num(j.sOfficeLng),num(j.sOfficeLat)]).filter(([x,y])=>x>124&&x<132&&y>33&&y<39);
    if(kor.length){const b=new maplibregl.LngLatBounds();kor.forEach(c=>b.extend(c));map.fitBounds(b,{padding:50,maxZoom:10});}
  });
}

/* ===== 업종별 아이콘 — 모양은 업종, 색은 연봉(viridis) =====

let symbolByType={}, markers=[];
function symbolOf(type){return symbolByType[type]||"_";}
function avgOf(a){const v=a.filter(x=>x!=null);return v.length?v.reduce((p,c)=>p+c,0)/v.length:0;}
function modeType(items){const c={};let best=null,bn=0;items.forEach(j=>{const t=j.sOfficeType||"";c[t]=(c[t]||0)+1;if(c[t]>bn){bn=c[t];best=t;}});return best;}
function rebuildMarkers(list){
  markers.forEach(m=>m.remove()); markers=[];
  const groups={};
  for(const j of list){const lng=num(j.sOfficeLng),lat=num(j.sOfficeLat);
    if(lng==null||lat==null||(lng===0&&lat===0))continue;
    const k=lng.toFixed(5)+","+lat.toFixed(5);
    (groups[k]=groups[k]||{lng,lat,items:[]}).items.push(j);}
  for(const k in groups){const g=groups[k];
    const sym=symbolOf(modeType(g.items));
    const color=salaryColor(avgOf(g.items.map(j=>num(j.sOfficeSalary))));
    const el=document.createElement("div"); el.className="jgm";
    el.innerHTML=`<div class="jgm-in"><svg viewBox="0 -960 960 960" width="30" height="30"><path d="${ICON[sym]||ICON._}" fill="none" stroke="#ffffff" stroke-width="96" stroke-linejoin="round"/><path d="${ICON[sym]||ICON._}" fill="${color}" stroke="rgba(15,23,42,.5)" stroke-width="22" paint-order="stroke"/></svg>`+
      (g.items.length>1?`<span class="cnt">${g.items.length}</span>`:"")+`</div>`;
    el.title=(g.items[0].sOfficeName||"")+" ["+(modeType(g.items)||"")+"]";
    el.addEventListener("click",()=>popupGroup(g));
    markers.push(new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([g.lng,g.lat]).addTo(map));
  }
}
function popupGroup(g){
  const head=`<b>${esc(g.items[0].sOfficeName||"")}</b> <span style="color:#00695c">[${esc(modeType(g.items)||"")}]</span><br>${esc(g.items[0].sOfficeAddress||"")}`;
  const rows=g.items.map(j=>`<div style="border-top:1px solid #eee;padding-top:3px;margin-top:3px">`+
    `${esc((""+(j.sStudentYear||"")).slice(-2))}학번 <b>${esc(j.sStudentName||"")}</b> · 연봉 ${esc(j.sOfficeSalary||"")}만원`+
    (j.sOfficeURL?` · <a href="${esc(j.sOfficeURL)}" target="_blank">홈페이지</a>`:"")+
    (isIn()?` · <a href="#" onclick="openEdit(${j.id});return false;">수정</a>`:"")+`</div>`).join("");
  new maplibregl.Popup({maxWidth:"280px"}).setLngLat([g.lng,g.lat]).setHTML(head+rows).addTo(map);
}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===== CRUD ===== */
function requireLogin(){if(!isIn()){toast("로그인 후 편집할 수 있습니다.");return false;}return true;}
function openEdit(id){
  if(!requireLogin())return;
  const j=id!=null?JOBS.find(x=>x.id===id):null;
  document.getElementById("modalTitle").textContent=j?"취업 사례 수정":"취업 사례 추가";
  document.getElementById("eDelete").style.display=j?"inline-block":"none";
  document.getElementById("editErr").textContent="";
  const g=(k,v)=>document.getElementById(k).value=v==null?"":v;
  g("eId",j?j.id:"");g("eDpt",j&&j.sStudentDpt);g("eYear",j&&j.sStudentYear);g("eName",j&&j.sStudentName);
  g("eGrade",j&&j.sStudentGrade);g("eToeic",j&&j.sStudentTOEIC);g("eOffice",j&&j.sOfficeName);
  g("eSalary",j&&j.sOfficeSalary);g("eURL",j&&j.sOfficeURL);g("eAddr",j&&j.sOfficeAddress);
  g("eLng",j&&j.sOfficeLng);g("eLat",j&&j.sOfficeLat);
  document.getElementById("eType").value=j?j.sOfficeType:document.getElementById("eType").options[0]?.value;
  document.getElementById("modalBg").style.display="flex";
}
function closeEdit(){document.getElementById("modalBg").style.display="none";}
function formObj(){const v=k=>document.getElementById(k).value;
  return{sStudentDpt:v("eDpt"),sStudentYear:v("eYear"),sStudentName:v("eName"),sStudentGrade:v("eGrade"),
    sStudentTOEIC:v("eToeic"),sOfficeName:v("eOffice"),sOfficeType:v("eType"),sOfficeSalary:v("eSalary"),
    sOfficeURL:v("eURL"),sOfficeAddress:v("eAddr"),sOfficeLng:v("eLng"),sOfficeLat:v("eLat")};}
async function saveJob(){
  if(!requireLogin())return;
  const idv=document.getElementById("eId").value, obj=formObj();
  document.getElementById("eSave").disabled=true;
  try{
    if(idv!==""){
      await api('/rest/v1/jobgis_jobs?id=eq.'+idv,{method:"PATCH",headers:Object.assign(authHeaders(true),{Prefer:"return=representation"}),body:JSON.stringify(obj)});
      Object.assign(JOBS.find(x=>x.id==idv),obj); toast("수정되었습니다.");
    }else{
      const r=await api('/rest/v1/jobgis_jobs',{method:"POST",headers:Object.assign(authHeaders(true),{Prefer:"return=representation"}),body:JSON.stringify(obj)});
      JOBS.push(r[0]); toast("추가되었습니다.");
    }
    closeEdit(); apply();
  }catch(e){document.getElementById("editErr").textContent="저장 실패: "+e.message.slice(0,140);}
  finally{document.getElementById("eSave").disabled=false;}
}
async function deleteJob(){
  if(!requireLogin())return;
  const idv=document.getElementById("eId").value; if(idv===""||!confirm("이 사례를 삭제할까요?"))return;
  try{await api('/rest/v1/jobgis_jobs?id=eq.'+idv,{method:"DELETE",headers:authHeaders(true)});
    JOBS=JOBS.filter(x=>x.id!=idv); closeEdit(); apply(); toast("삭제되었습니다.");}
  catch(e){document.getElementById("editErr").textContent="삭제 실패: "+e.message.slice(0,140);}
}

/* ===== 인증/설정 ===== */
async function login(){
  const email=document.getElementById("liEmail").value.trim(),pw=document.getElementById("liPw").value;
  if(!email||!pw){toast("이메일/비밀번호 입력");return;}
  try{const r=await api('/auth/v1/token?grant_type=password',{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    SESSION={access_token:r.access_token,refresh_token:r.refresh_token,email};lsSet("cfms_session",JSON.stringify(SESSION));
    toast("로그인되었습니다. 학생 이름이 표시됩니다.");renderAuth();loadAll();
  }catch(e){toast("로그인 실패: 이메일/비밀번호 확인");}
}
function logout(){SESSION=null;lsDel("cfms_session");renderAuth();loadAll();toast("로그아웃");}
function renderAuth(){
  const bar=document.getElementById("authbar");
  document.getElementById("btnAdd").disabled=!isIn();
  if(isIn())bar.innerHTML=`<span class="pill">✔ ${esc(SESSION.email)}</span><button class="btn g" onclick="logout()">로그아웃</button>`;
  else bar.innerHTML=`<input id="liEmail" placeholder="이메일" style="width:130px"><input id="liPw" type="password" placeholder="비밀번호" style="width:105px"><button class="btn" onclick="login()">로그인</button><button class="btn g" onclick="openConfig()" title="설정">⚙</button>`;
}
function openConfig(){document.getElementById("cfgUrl").value=CFG.url;document.getElementById("cfgKey").value=CFG.key;document.getElementById("cfgBg").style.display="flex";}
function saveConfig(){const url=normUrl(document.getElementById("cfgUrl").value),key=document.getElementById("cfgKey").value.trim();
  if(!url||!key){document.getElementById("cfgErr").textContent="입력하세요";return;}
  CFG={url,key};lsSet("cfms_url",url);lsSet("cfms_key",key);document.getElementById("cfgBg").style.display="none";boot();}
function showBanner(m){const b=document.getElementById("banner");b.textContent=m;b.style.display="block";}
let tT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2400);}

function boot(){renderAuth();
  if(!CFG.url||!CFG.key){showBanner("⚙ 버튼으로 Supabase 연결정보를 입력하세요.");openConfig();return;}
  loadAll();
}
boot();
