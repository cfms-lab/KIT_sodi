function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// === 투고 상태 배지 (draft / submit / revision / accepted / printed) ===
// 값 형식: "저널,상태[,MM-DD]". draft는 예정 저널이 정해진 노드만 표기.
// 정본: Papers/투고현황.md frontmatter(graph_badges) — graphify-out/status_badges.py 로 재적용 가능.
const STATUS_BADGES = {
  "Tomo_SFTF": "RPJ,submit,07-20",
  "Tomo_SFTFSoft": "RPJ,draft",
  "SFTF_Clustering": "RPJ,draft",
  "SFTFSoft_GNN": "IJAMT, draft",
  "SFTF_DrapePrior": "IJCST, draft",
  "PFTF_VisCull_kDop": "C&G,draft",
  "PFTF_alpha": "장점부각실패"
};
const STATUS_COLORS = { draft: "#64748b", submit: "#d4a017", revision: "#e06e10", accepted: "#12a150", printed: "#7a3fd1" };
NODES.forEach(n => {
  const b = STATUS_BADGES[n.id];
  if (!b) return;
  n.label = n.label + "\n[" + b + "]";
  n.title = (n.title || n.id) + " — 투고 상태: " + b;
  const st = (b.split(",")[1] || "").trim();
  const c = STATUS_COLORS[st] || "#64748b";
  n.color = Object.assign({}, n.color, { border: c, highlight: Object.assign({}, (n.color && n.color.highlight) || {}, { border: c }) });
  n.borderWidth = 5;
});

const nodesDS = new vis.DataSet(NODES.map(n => ({ ...n, font: { ...(n.font||{}), multi: true }, borderWidth: n.borderWidth || (n._hierarchy_role === 'aggregation' || n._hierarchy_role === 'group' ? 2 : 1.5) })));
const edgesDS = new vis.DataSet(EDGES);
const network = new vis.Network(document.getElementById('graph'), {nodes:nodesDS, edges:edgesDS}, {
  physics: { enabled:false },
  interaction: { hover:true, tooltipDelay:120, navigationButtons:true, keyboard:true, multiselect:false },
  nodes: { shape:'dot', borderWidth:1.5, chosen:true },
  edges: { smooth: { type:'cubicBezier', forceDirection:'horizontal', roundness:0.12 }, selectionWidth:3 }
});
network.once('afterDrawing', () => network.fit({ animation:false }));
function showInfo(id) {
  const n = nodesDS.get(id); if (!n) return;
  const neighbors = network.getConnectedNodes(id);
  const neighborItems = neighbors.map(nid => { const x=nodesDS.get(nid); return `<span class="neighbor-link" data-nid="${esc(nid)}">${esc(x?.label || nid).replace(/\n/g,' · ')}</span>`; }).join('');
  const role = n._hierarchy_role === 'aggregation' ? '공통 베이스 허브' : n._hierarchy_role === 'group' ? '발견 그룹 허브' : n._hierarchy_role === 'base' ? '베이스 프로젝트' : '응용 프로젝트';
  document.getElementById('info-content').innerHTML = `<div class="field"><b>${esc((n.label||'').replace(/\n/g,' · '))}</b></div><div class="field">구분: ${role}</div>${n._intro ? `<div class="field"><b>소개:</b> ${esc(n._intro)}</div>` : ''}${n._quality ? `<div class="field">Paper quality: <b>${esc(n._quality)}</b></div>` : ''}${n._quality_note ? `<div class="field" style="font-size:11px;color:#666">${esc(n._quality_note)}</div>` : ''}${n._source_file ? `<div class="field">Source: ${esc(n._source_file)}</div>` : ''}${n._members ? `<div class="field">구성: ${n._members.length}개</div>` : ''}${neighbors.length ? `<div class="field" style="margin-top:8px;color:#888;font-size:11px">연결 (${neighbors.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}`;
}
document.addEventListener('click', e => { const el=e.target.closest('.neighbor-link'); if(el){ network.focus(el.dataset.nid,{scale:1.2,animation:true}); network.selectNodes([el.dataset.nid]); showInfo(el.dataset.nid); } });
network.on('click', p => { if(p.nodes.length) showInfo(p.nodes[0]); });
document.getElementById('reset-btn').addEventListener('click', () => { nodesDS.forEach(n => { if(POS[n.id]) nodesDS.update({id:n.id,x:POS[n.id].x,y:POS[n.id].y}); }); network.fit({animation:true}); });
document.getElementById('fit-btn').addEventListener('click', () => network.fit({animation:true}));
const search=document.getElementById('search'), results=document.getElementById('search-results');
search.addEventListener('input', () => { const q=search.value.trim().toLowerCase(); results.innerHTML=''; if(!q){results.style.display='none';return;} const hits=NODES.filter(n=>(n.label||'').toLowerCase().includes(q)); hits.forEach(n=>{const d=document.createElement('div');d.className='search-item';d.textContent=(n.label||'').replace(/\n/g,' · ');d.onclick=()=>{network.focus(n.id,{scale:1.3,animation:true});network.selectNodes([n.id]);showInfo(n.id);results.style.display='none';};results.appendChild(d);}); results.style.display=hits.length?'block':'none'; });
