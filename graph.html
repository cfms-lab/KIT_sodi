     「투고 진도」 바로 다음 칸에 붙는다. 범례가 길어지면 예전처럼 줄어들며 스크롤한다. */

  n.title = (n.title || n.id) + " — 투고 상태: " + b;
  const st = (b.split(",")[1] || "").trim();

  n.color = Object.assign({}, n.color, { border: c, highlight: Object.assign({}, (n.color && n.color.highlight) || {}, { border: c }) });

});
}

// (2026-08-28: 활용 분야별로 갈라 놓았던 62개 엣지를 개발 목표 33개로 정리했다.)
/* 한 노드에 엣지가 몰리면 기본값(continuous · roundness 0.2)으로는 선이 거의 겹쳐
   화살표도 라벨도 뭉친다 — cfmsDrape 가 그렇다(드나드는 엣지 9개가 두 개의 좁은 각도

   부풀어 나간 곡선이 이웃 묶음으로 파고드는 정도, 사이에 낀 노드가 함께 정한다.
   그래서 규칙 대신 **재서 고른다**.

   방법: 각 엣지마다 후보(휘는 방향 × 곡률)를 놓고, vis 가 실제로 그릴 곡선을 그대로
   떠서(edgeType.getPoint) 표본을 만든 뒤, 「엣지끼리 너무 가까운 정도 + 남의 노드를

   뺀다.

   좌표만 읽는다(같은 값을 준다는 것을 실측으로 확인했다). 다 고른 뒤 한 번만
   DataSet 에 넣는다.

   살아 있는 좌표로 계산하고, 배치가 바뀔 때마다(표에서 받은 뒤·노드를 놓은 뒤·자유
   배치로 돌아올 때) 다시 고른다. 허브를 늘리려면 FAN_EDGE_HUBS 에 id 를 더한다. */
const DEFAULT_EDGE_SMOOTH = { type: 'continuous', roundness: 0.2 };
const FAN_EDGE_HUBS = ['cfmsDrape'];
const FAN_SKIP_R = 45;        // 허브에서 이만큼 안쪽 표본은 벌점에서 뺀다
const FAN_NEAR = 26;          // 엣지끼리 이보다 가까우면 벌점
const FAN_NODE_R = 30;        // 남의 노드 중심에서 이보다 가까이 지나가면 벌점
const FAN_NODE_W = 1.5;       // 노드를 지나가는 쪽을 조금 더 싫어한다
const FAN_BEND_W = 40;        // 같은 값이면 덜 휜 쪽을 고른다
const FAN_SAMPLES = 32;
const FAN_PASSES = 4;
const FAN_CANDIDATES = (() => {
  const list = [{ type: 'continuous', roundness: 0.2 }];
  [0.1, 0.2, 0.3, 0.45, 0.6].forEach(r => {
    list.push({ type: 'curvedCW', roundness: r });
    list.push({ type: 'curvedCCW', roundness: r });
  });
  return list;
})();

/* 엣지 하나를 주어진 smooth 로 세우고 곡선 위 점을 뜬다. DataSet 을 거치지 않으므로
   화면이 다시 그려지지 않는다. */
function _fanSamplePoints(edgeId, smooth) {
  const ve = network.body.edges[edgeId];
  if (!ve || !ve.edgeType || typeof ve.edgeType.getPoint !== 'function') return null;
  ve.options.smooth = { enabled: true, forceDirection: false,
                        type: smooth.type, roundness: smooth.roundness };
  if (ve.edgeType.options !== ve.options) ve.edgeType.options = ve.options;
  ve.edgeType.via = undefined;
  const pts = [];
  for (let j = 0; j <= FAN_SAMPLES; j++) {
    const p = ve.edgeType.getPoint(j / FAN_SAMPLES);
    if (p && Number.isFinite(p.x)) pts.push(p);
  }
  return pts;
}

function computeFanSmooth() {
  const chosen = {};
  FAN_EDGE_HUBS.forEach(hub => {
    const hubPos = network.getPositions([hub])[hub];
    if (!hubPos) return;
    const ids = [];
    RAW_EDGES.forEach((e, i) => {
      if ((e.from === hub || e.to === hub) && e.from !== e.to && network.body.edges[i]) ids.push(i);
    });
    if (ids.length < 2) return;

    // 사이에 끼면 곤란한 노드들 — 이 묶음의 양 끝은 뺀다.
    const endpoints = new Set([hub]);
    ids.forEach(i => { endpoints.add(RAW_EDGES[i].from); endpoints.add(RAW_EDGES[i].to); });
    const allPos = network.getPositions();
    const obstacles = Object.keys(allPos)
      .filter(id => !endpoints.has(id))
      .map(id => allPos[id]);

    // 후보마다 표본과 「노드 지나감」 벌점을 미리 구해 둔다.
    const sampled = ids.map(i => FAN_CANDIDATES.map(c => {
      const pts = _fanSamplePoints(i, c);
      if (!pts) return null;
      const far = pts.filter(p => Math.hypot(p.x - hubPos.x, p.y - hubPos.y) >= FAN_SKIP_R);
      let nodePen = 0;
      for (const p of far) for (const o of obstacles) {
        const d = Math.hypot(p.x - o.x, p.y - o.y);
        if (d < FAN_NODE_R) nodePen += (FAN_NODE_R - d) * (FAN_NODE_R - d) * FAN_NODE_W;
      }
      return { pts: far, nodePen, bend: c.roundness * (c.type === 'continuous' ? 0 : 1) };
    }));

    const pairPen = (a, b) => {
      if (!a || !b) return 0;
      let pen = 0, min = Infinity;
      for (const p of a.pts) for (const q of b.pts) {
        const d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < min) min = d;
      }
      if (min < FAN_NEAR) pen = (FAN_NEAR - min) * (FAN_NEAR - min);
      return pen;
    };

    // 좌표하강: 기본값에서 시작해 한 엣지씩 가장 좋은 후보로 바꾼다.
    const pick = ids.map(() => 0);
    const costOf = (k, c) => {
      const me = sampled[k][c];
      if (!me) return Infinity;
      let sum = me.nodePen + me.bend * FAN_BEND_W;
      for (let j = 0; j < ids.length; j++) if (j !== k) sum += pairPen(me, sampled[j][pick[j]]);
      return sum;
    };
    for (let pass = 0; pass < FAN_PASSES; pass++) {
      let moved = false;
      for (let k = 0; k < ids.length; k++) {
        let best = pick[k], bestCost = costOf(k, pick[k]);
        for (let c = 0; c < FAN_CANDIDATES.length; c++) {
          if (c === pick[k]) continue;
          const cost = costOf(k, c);
          if (cost < bestCost - 1e-9) { bestCost = cost; best = c; }
        }
        if (best !== pick[k]) { pick[k] = best; moved = true; }
      }
      if (!moved) break;
    }
    ids.forEach((i, k) => { chosen[i] = FAN_CANDIDATES[pick[k]]; });
  });
  return chosen;
}

let FAN_SMOOTH = {};
const edgeSmooth = i => FAN_SMOOTH[i] || DEFAULT_EDGE_SMOOTH;

/* 부채꼴을 지금 좌표로 다시 고르고 화면에 반영한다. 계층 배치에서는 전역 cubicBezier 가
   맞으므로 아무것도 하지 않는다 — 자유 배치로 돌아올 때 applyLayout 이 다시 부른다. */
let _fanKey = '';
let _fanBusy = false;

/* 부채꼴이 보는 좌표들을 한 줄로 요약한다 — 허브와 거기 닿는 노드뿐이다. */
function _fanPositionKey() {
  const ids = new Set();
  FAN_EDGE_HUBS.forEach(hub => {
    ids.add(hub);
    RAW_EDGES.forEach(e => {
      if (e.from === hub) ids.add(e.to);
      else if (e.to === hub) ids.add(e.from);
    });
  });
  const list = [...ids].sort();
  const pos = network.getPositions(list);
  return list.map(id => {
    const p = pos[id];
    return p ? id + ':' + Math.round(p.x) + ',' + Math.round(p.y) : id + ':?';
  }).join('|');
}

/* 부채꼴을 지금 좌표로 다시 고르고 화면에 반영한다. 계층 배치에서는 전역
   cubicBezier 가 맞으므로 아무것도 하지 않는다 — 자유 배치로 돌아올 때
   applyLayout 이 다시 부른다. */
function refreshFanSmooth() {
  if (layoutMode !== 'free') return;
  _fanKey = _fanPositionKey();
  FAN_SMOOTH = computeFanSmooth();
  edgesDS.update(RAW_EDGES.map((e, i) => ({ id: i, smooth: edgeSmooth(i) })));
}


const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  hidden: false,
  label: '',
  smooth: DEFAULT_EDGE_SMOOTH,   // 아래 refreshFanSmooth() 가 곧 다시 잰다
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: dimmedEdgeColor(e),
  arrows: { to: { enabled: true, scaleFactor: 1.0 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: false,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.08,
      damping: 0.4,
      avoidOverlap: 0.8,
    },
    stabilization: { iterations: 200, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: { shape: 'dot', borderWidth: 1.5 },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

// === 배치 모드 =========================================================
// 이 그래프는 사이클이 없는 DAG(32 노드 / 33 개발목표 엣지)이다.
// 자유 배치는 PFTF·Tomo_SFTF 두 허브의 스포크가 서로를 가로질러
// 교차가 심해진다. 계층(Sugiyama) 배치는 의존 방향을 축으로 세워
// 교차를 구조적으로 줄인다.

// 최장경로 계층화: level(v) = 0 (선행 없음) 또는 1 + max(level(선행))
const PRED = {};
RAW_NODES.forEach(n => { PRED[n.id] = []; });
RAW_EDGES.forEach(e => { if (PRED[e.to]) PRED[e.to].push(e.from); });
const LEVEL = {};
function levelOf(id, seen) {
  if (LEVEL[id] !== undefined) return LEVEL[id];
  seen = seen || {};
  if (seen[id]) return 0;              // 안전장치(현재 그래프엔 사이클 없음)
  seen[id] = true;
  const ps = PRED[id] || [];
  LEVEL[id] = ps.length === 0 ? 0 : 1 + Math.max(...ps.map(p => levelOf(p, seen)));
  return LEVEL[id];
}
RAW_NODES.forEach(n => levelOf(n.id));

let layoutMode = 'free';

/* 부채꼴 첫 계산. ⚠️ 여기보다 위에서 부르면 안 된다 — refreshFanSmooth 가 보는
   layoutMode 가 아직 TDZ 라서 typeof 조차 던지고, 그 자리에서 스크립트 전체가
   멈춘다(2026-09-20 에 실제로 그랬다: showHyper 부터 아래가 통째로 안 섰다). */
refreshFanSmooth();

/* 좌표가 바뀌면 스스로 다시 고른다.
   노드를 옮기는 길이 여럿이고(드래그 · 표에서 받은 공유 배치 · 「위치 초기화」)
   그중 일부는 **생성기가 소유한 코드** 안에 있어 호출부를 심으면 재생성이
   지운다. 그래서 호출부 대신 좌표를 본다. 허브에 닿는 노드 열 개 남짓만
   보므로 프레임당 비용은 무시할 만하다. 다시 고른 뒤 한 프레임 더 그려지고,
   그때는 키가 같아 아무 일도 하지 않는다(무한 되먹임 없음). */
network.on('afterDrawing', () => {
  if (_fanBusy || layoutMode !== 'free') return;
  if (_fanPositionKey() === _fanKey) return;
  _fanBusy = true;
  try { refreshFanSmooth(); } finally { _fanBusy = false; }
});

function applyLayout(mode) {
  layoutMode = mode;
  const posBtnsOn = (mode === 'free');
  document.getElementById('reset-pos-btn').disabled = !posBtnsOn;
  document.getElementById('copy-pos-btn').disabled = !posBtnsOn;

  if (mode === 'free') {
    network.setOptions({
      layout: { hierarchical: { enabled: false } },
      edges: { smooth: DEFAULT_EDGE_SMOOTH },
    });
    refreshFanSmooth();
    RAW_NODES.forEach(n => {
      const p = savedPos[n.id] || POS[n.id];
      if (p) network.moveNode(n.id, p.x, p.y);
    });
  } else {
    // 계층 배치에서는 각 노드의 level을 명시해 vis의 추정에 맡기지 않는다.
    const hierSmooth = { type: 'cubicBezier',
      forceDirection: mode === 'LR' ? 'horizontal' : 'vertical', roundness: 0.55 };
    nodesDS.update(RAW_NODES.map(n => ({ id: n.id, level: LEVEL[n.id] })));
    network.setOptions({
      layout: {
        hierarchical: {
          enabled: true,
          direction: mode,               // 'LR' 또는 'UD'
          sortMethod: 'directed',
          shakeTowardsRoot: true,
          levelSeparation: mode === 'LR' ? 260 : 190,
          nodeSpacing: 130,
          treeSpacing: 160,
          blockShifting: true,
          edgeMinimization: true,        // 층 내 순서를 바꿔 교차를 줄인다
          parentCentralization: true,
        },
      },
      edges: { smooth: hierSmooth },
    });
    // 엣지별 smooth 는 전역 설정을 이긴다. 비우는 대신 같은 값을 덮어써야
    // cfmsDrape 부채꼴만 계층 배치에서 혼자 남는 일이 없다 (DataSet.update 는
    // undefined 를 「지우라」가 아니라 「건드리지 말라」로 읽는다).
    edgesDS.update(RAW_EDGES.map((e, i) => ({ id: i, smooth: hierSmooth })));
  }
  network.fit({ animation: { duration: 400 } });
}

document.getElementById('layout-sel').addEventListener('change', ev => {
  applyLayout(ev.target.value);
});

// === 가시성 토글 (에지 / hyperedge) ===================================
// 2026-08-22: '포커스'·'허브 접기' 를 걷어내고 '에지'·'hyperedge' 로 바꿨다.
// 2026-09-10: '개발 목표'(에지) 는 기본 켜짐. '원거리(하) 표시' 토글은 far 노드가
// 하나도 남지 않아 걷어냈다.
// 가시성은 항상 applyVisibility() 를 거친다. 노드에는 숨김만 얹고 hidden:false 로
// 되돌리지 않는다 — 커뮤니티 필터가 내린 결정을 덮어쓰지 않기 위해서다.
// 엣지는 커뮤니티 필터를 타지 않으므로 매번 전량 다시 계산한다.

// DEGREE/NEIGH 는 인접행렬 뷰의 '정렬: 차수' 가 쓴다.
const DEGREE = {};
const NEIGH = {};
RAW_NODES.forEach(n => { DEGREE[n.id] = 0; NEIGH[n.id] = new Set(); });
RAW_EDGES.forEach(e => {
  if (DEGREE[e.from] === undefined || DEGREE[e.to] === undefined) return;
  DEGREE[e.from]++; DEGREE[e.to]++;
  NEIGH[e.from].add(e.to); NEIGH[e.to].add(e.from);
});

let showEdges = true;   // 노드 간 의존 엣지('개발 목표') — 기본 켜짐
let showHyper = true;   // 영역(hull) + 영역 간 의존 화살표 — afterDrawing 이 읽는다

// '에지' 를 끈 상태에서 노드를 클릭하면 그 노드에 붙은 엣지만 보여준다.
// 빈 곳을 클릭하면 다시 전부 숨는다. ('에지' 가 켜져 있으면 아무 영향이 없다.)
let edgeFocusId = null;   // 이름 주의: 아래 인접행렬의 focusNode() 와 겹치면 안 된다

// 엣지만 다시 계산한다. 노드는 건드리지 않는다 — '에지'·'hyperedge' 토글이
// 커뮤니티 필터의 결정을 흔들면 안 된다.
// 엣지는 양 끝 노드의 **실제** 가시성을 따르므로, 어느 필터로 숨었든 알아서 따라 숨는다.
function applyEdgeVisibility() {
  const nodeHidden = id => { const n = nodesDS.get(id); return !n || n.hidden === true; };
  edgesDS.update(RAW_EDGES.map((e, i) => {
    const incident = edgeFocusId !== null && (e.from === edgeFocusId || e.to === edgeFocusId);
    return {
      id: i,
      hidden: (!showEdges && !incident) || nodeHidden(e.from) || nodeHidden(e.to),
    };
  }));
  network.redraw();   // hull 은 캔버스 오버레이라 데이터만 갱신해서는 다시 그려지지 않는다
  updateStatsLine();
}

// 클릭 대상 판정은 아래 정보패널 핸들러와 같은 규칙을 쓴다: vis 가 params.nodes 를
// 비워 보내는 경우가 있어 hoveredNodeId 로 보완한다(hover 판정이 더 안정적이다).
network.on('click', params => {
  const hovered = (typeof hoveredNodeId !== 'undefined') ? hoveredNodeId : null;
  const hit = (params.nodes && params.nodes.length) ? params.nodes[0] : hovered;
  const next = (hit === undefined) ? null : hit;
  if (next === edgeFocusId) return;
  edgeFocusId = next;
  if (!showEdges) applyEdgeVisibility();   // '에지' 가 켜져 있으면 화면이 바뀔 게 없다
});

// 노드 가시성이 바뀐 뒤의 전체 갱신. 커뮤니티 필터가 부른다.
// (예전에는 여기서 원거리(하) 노드도 숨겼다. 그 토글과 함께 걷어냈다.)
function applyVisibility() {
  applyEdgeVisibility();
}

document.getElementById('edge-cb').addEventListener('change', ev => {
  showEdges = ev.target.checked;
  applyEdgeVisibility();
});

document.getElementById('hyper-cb').addEventListener('change', ev => {
  showHyper = ev.target.checked;
  applyEdgeVisibility();
});

// === 인접행렬 뷰 =======================================================
// 37x37 격자. 노드-링크 도면과 달리 교차선이 원리적으로 존재하지 않는다.
// 행 = 출발(from), 열 = 도착(to). 행·열 정렬을 바꾸면 블록 구조가 드러난다.
// 주제 가족순으로 정렬했을 때 대각 블록이 진하면 목표가 가족 안에서 닫혀 있다는 뜻이고,
// 블록 밖에 남는 칸이 가족 사이의 다리다.

const EDGE_AT = {};                       // "from\u0000to" -> 엣지
RAW_EDGES.forEach(e => { EDGE_AT[e.from + '\u0000' + e.to] = e; });
const NODE_BY_ID = Object.fromEntries(RAW_NODES.map(n => [n.id, n]));

const HORIZON = Object.fromEntries(RAW_NODES.map(n => [n.id, n._horizon]));

// 주제 가족 — '정렬: 주제 가족' 이 쓴다. 노드의 _family 를 우선하고, 없으면 id 접두어로
// 정한다 (SFTFSoft_* → SFTF, cfms* → cfms, ColdOndol* → ColdOndol: 기존 _family 관례).
// 2026-09-10: 예전 '커뮤니티' 정렬은 논문 품질 등급으로 묶어서 같은 블록 안에 서로 이어질
// 이유가 없었다(47개 중 17개만 대각 블록 안). 주제로 묶어야 블록이 드러난다.
// ColdOndol 은 폴더로는 __PFTF_Projects 아래지만 hyperedge 영역이 따로 있어 가족도 따로 둔다.
// Tomo_* 는 _family 가 'Tomo' 지만 같은 폴더(__SFTF_Projects)의 뿌리 셋이라 SFTF 로 합친다.
// 따로 두면 Tomo → SFTF 엣지 7개가 전부 블록 밖으로 나가 SFTF 블록이 비어 보인다.
const FAMILY_ALIAS = { Tomo: 'SFTF' };
const FAMILY_ORDER = ['SFTF', 'PFTF', 'cfms', 'ColdOndol'];   // 연구 계보 순
function familyOf(n) {
  const id = String(n.id);
  let family = n._family;
  if (!family) {
    if (/^cfms/.test(id)) family = 'cfms';
    else if (/^ColdOndol/.test(id)) family = 'ColdOndol';
    else if (/^(Tomo|SFTF|SFTFSoft)_/.test(id)) family = 'SFTF';
    else if (/^PFTF(_|$)/.test(id)) family = 'PFTF';
    else family = id.split('_')[0];        // 그 밖(TSE_SEM_* 트랙 등)은 접두어가 곧 가족
  }
  return FAMILY_ALIAS[family] || family;
}
const FAMILY = Object.fromEntries(RAW_NODES.map(n => [n.id, familyOf(n)]));
const familyRank = f => { const i = FAMILY_ORDER.indexOf(f); return i < 0 ? FAMILY_ORDER.length : i; };

// 개발 목표의 범주 — 인접행렬 셀 글리프와 범례가 쓴다.
const REL_GLYPH = {
  '확장': '▲', '가속': '»', '정확도': '◆', '통합': '●',
};
const glyphFor = lbl => REL_GLYPH[lbl] || '\u25aa';

function matrixOrder(mode) {
  const arr = RAW_NODES.slice();
  const byName = (a, b) => a.id.localeCompare(b.id);
  if (mode === 'name') return arr.sort(byName);
  if (mode === 'degree') return arr.sort((a, b) => DEGREE[b.id] - DEGREE[a.id] || byName(a, b));
  if (mode === 'level') return arr.sort((a, b) => LEVEL[a.id] - LEVEL[b.id] || byName(a, b));
  return arr.sort((a, b) =>                    // family: 가족 → 의존 계층 → 이름
    (familyRank(FAMILY[a.id]) - familyRank(FAMILY[b.id]))
    || FAMILY[a.id].localeCompare(FAMILY[b.id])
    || (LEVEL[a.id] - LEVEL[b.id]) || byName(a, b));
}

function groupKey(n, mode) {
  if (mode === 'level') return 'L' + LEVEL[n.id];
  if (mode === 'degree') return DEGREE[n.id] >= 5 ? '\ud5c8\ube0c' : (DEGREE[n.id] === 1 ? '\uc78e' : '\uc911\uac04');
  if (mode === 'name') return n.id[0].toUpperCase();
  return FAMILY[n.id];                          // family
}

function buildMatrix() {
  const mode = document.getElementById('matrix-sort').value;
  const order = matrixOrder(mode);
  const idx = Object.fromEntries(order.map((n, i) => [n.id, i]));

  let html = '<table class="adj"><thead><tr><th class="grp"></th><th class="grp"></th>';
  order.forEach(n => {
    html += '<th class="colhead" data-col="' + esc(n.id) + '" title="' + esc(n.id) + '">'
          + esc(n.id) + '</th>';
  });
  html += '</tr></thead><tbody>';

  let prevGrp = null;
  order.forEach(rn => {
    const g = groupKey(rn, mode);
    const newGrp = g !== prevGrp; prevGrp = g;
    html += '<tr data-row="' + esc(rn.id) + '">';
    html += '<th class="grp">' + (newGrp ? esc(g) : '') + '</th>';
    const sw = (rn.color && rn.color.background) || '#cccccc';
    html += '<th class="rowhead" data-row="' + esc(rn.id) + '" title="' + esc(rn.id) + '">'
          + '<span class="swatch" style="background:' + esc(sw) + '"></span>' + esc(rn.id) + '</th>';
    order.forEach(cn => {
      if (rn.id === cn.id) { html += '<td class="cell diag"></td>'; return; }
      const e = EDGE_AT[rn.id + '\u0000' + cn.id];
      if (!e) { html += '<td class="cell" data-r="' + esc(rn.id) + '" data-c="' + esc(cn.id) + '"></td>'; return; }
      const bg = (NODE_BY_ID[rn.id].color && NODE_BY_ID[rn.id].color.background) || '#666666';
      html += '<td class="cell on" data-r="' + esc(rn.id) + '" data-c="' + esc(cn.id) + '"'
            + ' style="background:' + esc(bg) + '"'
            + ' title="' + esc(rn.id + '  \u2192  ' + cn.id + '\n' + (e.label || '')) + '">'
            + glyphFor(e.label) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('matrix-host').innerHTML = html;

  const counts = {};
  RAW_EDGES.forEach(e => { counts[e._rel] = (counts[e._rel] || 0) + 1; });
  const legend = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([lbl, c]) => glyphFor(lbl) + ' ' + esc(lbl) + ' (' + c + ')').join(' \u00b7 ');
  document.getElementById('matrix-legend').innerHTML =
    '<b>\ud589 = \ucd9c\ubc1c \u2192 \uc5f4 = \ub3c4\ucc29</b> \u00b7 ' + RAW_NODES.length + '\u00d7' + RAW_NODES.length
    + ' \u00b7 \uc5f0\uacb0 ' + RAW_EDGES.length + '\uac1c (\ubc00\ub3c4 '
    + (RAW_EDGES.length / (RAW_NODES.length * (RAW_NODES.length - 1)) * 100).toFixed(1) + '%)<br>' + legend;

  wireMatrixEvents();
}

function wireMatrixEvents() {
  const host = document.getElementById('matrix-host');
  const clearHl = () => {
    host.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
    host.querySelectorAll('tr.hl').forEach(el => el.classList.remove('hl'));
  };
  host.addEventListener('mouseover', ev => {
    const cell = ev.target.closest('td.cell'); if (!cell) return;
    clearHl();
    const r = cell.dataset.r, c = cell.dataset.c;
    const tr = host.querySelector('tr[data-row="' + CSS.escape(r) + '"]');
    if (tr) tr.classList.add('hl');
    const th = host.querySelector('th.colhead[data-col="' + CSS.escape(c) + '"]');
    if (th) th.classList.add('hl');
    cell.classList.add('hl');
  });
  host.addEventListener('mouseleave', clearHl);
  host.addEventListener('click', ev => {
    const head = ev.target.closest('th.rowhead, th.colhead');
    if (head) { focusNode(head.dataset.row || head.dataset.col); return; }
    const cell = ev.target.closest('td.cell.on');
    if (cell) focusNode(cell.dataset.r);
  });
}

document.getElementById('matrix-sort').addEventListener('change', buildMatrix);

document.getElementById('view-sel').addEventListener('change', ev => {
  const isMatrix = ev.target.value === 'matrix';
  document.getElementById('graph').style.display = isMatrix ? 'none' : '';
  document.getElementById('matrix-wrap').classList.toggle('on', isMatrix);
  document.getElementById('matrix-sort').style.display = isMatrix ? '' : 'none';
  ['layout-sel', 'edge-cb', 'hyper-cb', 'blink-cb', 'reset-pos-btn', 'copy-pos-btn'].forEach(id => {
    const el = document.getElementById(id); if (el) el.disabled = isMatrix;
  });
  if (isMatrix) buildMatrix(); else network.fit({ animation: { duration: 300 } });
});

function updateStatsLine() {
  const vn = nodesDS.get({ filter: n => !n.hidden }).length;
  const ve = edgesDS.get({ filter: e => !e.hidden }).length;
  const el = document.getElementById('stats');
  if (!el || !el.firstChild) return;
  // 커뮤니티 수는 하드코딩하지 않는다. 범례가 늘면('그룹' 추가 등) 바로 어긋난다.
  el.firstChild.nodeValue = vn + ' nodes \u00b7 ' + ve + ' edges \u00b7 '
                          + LEGEND.length + ' communities\u00a0';
}



// 첫 화면부터 실제 가시 개수를 보인다. #stats 의 정적 텍스트는 생성기가 파일 기준으로
// 적는 대체 문구일 뿐이다.
updateStatsLine();

// === 드래그 위치 영속화 ===============================================
// 드래그가 끝나면 해당 노드들의 좌표를 localStorage에 저장한다.
// (이 브라우저에서 다시 열 때 저장 위치가 기본 배치 POS를 덮어쓴다.)
//
// 2026-09-19: 놓는 자리를 격자에 맞춘다(사용자 요청). 눈으로 열·행을 맞추려면
// 한두 픽셀 어긋난 값이 계속 걸리는데, 격자에 앉으면 같은 x 를 두 번 끌어도 같은
// 값이 나오므로 정렬이 쉬워진다. **끌어 놓은 노드만** 옮긴다 — 파일 POS·표의 공유
// 좌표에 격자에 맞지 않는 값이 있어도 손대지 않은 노드는 그 자리에 그대로 둔다.
// 간격은 5 로 시작했는데 끌어 봐도 걸리는 느낌이 없다고 해서 10 으로 올렸다
// (같은 날 사용자). 격자를 바꾸려면 이 상수만 고치면 된다.
const DRAG_GRID = 10;
const snapToGrid = v => Math.round(v / DRAG_GRID) * DRAG_GRID;
network.on('dragEnd', params => {
  if (layoutMode !== 'free') return;   // 계층 배치의 임시 좌표는 저장하지 않는다
  if (!params.nodes || params.nodes.length === 0) return;
  const positions = network.getPositions(params.nodes);
  let snapped = 0;
  params.nodes.forEach(id => {
    const p = positions[id];
    if (!p) return;
    const x = snapToGrid(p.x), y = snapToGrid(p.y);
    // 놓은 자리와 격자가 다르면 그 자리로 옮긴다. 훌과 엣지 캡션은 afterDrawing 이
    // 노드 좌표를 다시 읽어 그리므로 아래 redraw 한 번으로 같이 따라온다.
    if (x !== p.x || y !== p.y) { network.moveNode(id, x, y); snapped += 1; }
    savedPos[id] = { x, y };
  });
  if (snapped) network.redraw();
  try { localStorage.setItem(POS_STORE_KEY, JSON.stringify(savedPos)); } catch (e) {}
});

// 끄는 **도중에도** 격자로 움직인다 (2026-09-19, 사용자 요청 — 놓을 때만 붙으니
// 끌면서는 어디에 앉을지 안 보였다).
//
// vis 9.1.6 의 InteractionHandler.onDrag 는 마우스가 움직일 때마다 드래그 시작점 +
// 이동량으로 node.x/y 를 **직접** 쓴다. 'dragging' 이벤트는 그 쓰기보다 **먼저** 나오므로
// (generateClickEvent("dragging", …) 가 좌표 갱신 앞줄이다) 거기서는 새 좌표를 볼 수 없고,
// 거기서 옮겨 봐야 바로 덮어써진다. 그래서 캔버스가 실제로 부르는
// body.eventListeners.onDrag 를 감싸 원본이 쓴 직후에 다듬는다.
//
// 반올림 오차는 쌓이지 않는다 — 다음 마우스무브도 현재 좌표가 아니라 드래그 시작점에서
// 다시 계산하기 때문이다. 그려 주는 일은 원본이 이미 예약한 렌더가 한다. 그 사이에
// 값을 바꾸는 것이므로 격자 좌표가 그대로 화면에 나간다.
//
// 라이브러리 속을 건드리는 코드라 기대는 것이 없으면 조용히 건너뛴다 — 그때는 지금까지처럼
// 놓을 때만 스냅된다(위 dragEnd).
// 끄는 동안 이웃과 줄이 맞으면 점선 안내선을 보인다 (2026-09-19, 사용자 요청 —
// 파워포인트의 스마트 가이드처럼 이웃 노드와 나란한지 보고 싶다).
//   ALIGN_GUIDES 가 그 상태이고, 실제로 그리는 곳은 아래쪽 afterDrawing 묶음이다
//   (drawNodePie 다음). 안내선이 노드·훌 위에 오려면 그쪽에 늦게 붙어야 한다.
// 중심끼리만 견준다 — 노드마다 지름이 다르므로(진도에 따라 14~34) 가장자리를 맞추는
// 것은 뜻이 없다. 허용 오차는 격자(10)보다 작아야 한다. 그보다 크면 어느 자리에서나
// 선이 떠서 「맞았다」는 신호가 아니게 된다.
const ALIGN_TOL = 3;
let ALIGN_GUIDES = null;
function computeAlignGuides(ids) {
  if (!ids || !ids.length) return null;
  const all = network.getPositions();
  const base = all[ids[0]];                  // 묶음 드래그는 함께 움직이므로 첫 노드가 기준이다
  if (!base) return null;
  const dragging = new Set(ids);
  const guides = {vx: null, vFrom: base.y, vTo: base.y, hy: null, hFrom: base.x, hTo: base.x};
  nodesDS.get({filter: n => !n.hidden}).forEach(n => {
    if (dragging.has(n.id)) return;
    const p = all[n.id];
    if (!p) return;
    if (Math.abs(p.x - base.x) <= ALIGN_TOL) {
      guides.vx = base.x;
      guides.vFrom = Math.min(guides.vFrom, p.y);
      guides.vTo = Math.max(guides.vTo, p.y);
    }
    if (Math.abs(p.y - base.y) <= ALIGN_TOL) {
      guides.hy = base.y;
      guides.hFrom = Math.min(guides.hFrom, p.x);
      guides.hTo = Math.max(guides.hTo, p.x);
    }
  });
  return (guides.vx === null && guides.hy === null) ? null : guides;
}

(function installLiveSnap() {
  const listeners = network.body && network.body.eventListeners;
  const original = listeners && listeners.onDrag;
  if (typeof original !== 'function') return;
  let dragIds = [];
  network.on('dragStart', params => { dragIds = (params && params.nodes) || []; });
  network.on('dragEnd', () => {
    dragIds = [];
    if (ALIGN_GUIDES) { ALIGN_GUIDES = null; network.redraw(); }   // 놓으면 안내선을 지운다
  });
  listeners.onDrag = function () {
    original.apply(this, arguments);
    if (layoutMode !== 'free' || !dragIds.length) return;   // 화면을 끄는 중이면 빈 배열이다
    dragIds.forEach(id => {
      const node = network.body.nodes[id];
      if (!node) return;
      node.x = snapToGrid(node.x);
      node.y = snapToGrid(node.y);
    });
    ALIGN_GUIDES = computeAlignGuides(dragIds);
    // 원본이 건 렌더 예약에 얹는다(_requestRedraw 는 한 프레임으로 합쳐진다).
    // 노드가 안 움직인 프레임에도 안내선은 바뀔 수 있으므로 매번 부른다.
    network.body.emitter.emit('_requestRedraw');
  };
})();

/* 노드를 끌 때 툴팁 감추기.
   2026-09-20 에 노드 툴팁을 없앴으므로 이제 이 코드가 막는 것은 **엣지** 툴팁이다
   — 끄는 도중 화살표 위를 지나가면 그것이 뜬다. 노드 쪽이 사라졌다고 지우면
   그 경우가 되살아난다.
   화면을 통째로 미는 것(pan)은 params.nodes 가 비므로 건드리지 않는다.
   보장은 위의 CSS 가 하고, 여기서는 vis 가 예약해 둔 팝업까지 걷어
   놓는 순간 툴팁이 튀어나오지 않게 한다. 내부 필드를 만지므로 전부
   typeof 로 막아 둔다 — vis 를 올려도 페이지가 죽지 않아야 한다. */
(function hideTooltipWhileDragging() {
  const clearPending = () => {
    const ih = network.interactionHandler;
    if (!ih) return;
    if (ih.popupTimer) { clearTimeout(ih.popupTimer); ih.popupTimer = undefined; }
    if (ih.popup && typeof ih.popup.hide === 'function') ih.popup.hide();
    ih.popupObj = undefined;
  };
  network.on('dragStart', params => {
    if (!params || !params.nodes || !params.nodes.length) return;
    document.body.classList.add('node-dragging');
    clearPending();
  });
  network.on('dragEnd', () => {
    clearPending();          // 끄는 동안 예약된 팝업을 버린 뒤에 클래스를 뗀다
    document.body.classList.remove('node-dragging');
    refreshFanSmooth();      // 옮긴 자리에 맞춰 부채꼴을 다시 편다
  });
})();

// "위치 초기화": 저장본을 지우고 파일에 내장된 기본 배치(POS)로 복귀.
document.getElementById('reset-pos-btn').addEventListener('click', () => {
  savedPos = {};
  try { localStorage.removeItem(POS_STORE_KEY); } catch (e) {}
  RAW_NODES.forEach(n => { if (POS[n.id]) network.moveNode(n.id, POS[n.id].x, POS[n.id].y); });
  network.fit({ animation: true });
});

// "위치 복사": 현재 전체 배치를 POS 상수 형식의 JSON으로 클립보드에 복사.
// 마음에 드는 배치를 이 파일의 `const POS = {...}` 줄에 붙여 넣으면
// (또는 그렇게 요청하면) 저장 없이도 모든 브라우저·배포본의 기본값이 된다.
document.getElementById('copy-pos-btn').addEventListener('click', () => {
  const all = network.getPositions(RAW_NODES.map(n => n.id));
  const entries = RAW_NODES.map(n => {
    const p = all[n.id];
    return `"${n.id}": {"x": ${Math.round(p.x)}, "y": ${Math.round(p.y)}}`;
  });
  const text = 'const POS = {' + entries.join(', ') + '};';
  const done = () => {
    const btn = document.getElementById('copy-pos-btn');
    const old = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(() => { btn.textContent = old; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => window.prompt('복사 실패 — 직접 복사하세요:', text));
  } else {
    window.prompt('직접 복사하세요:', text);
  }
});

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(nid)}">${esc(nb ? (nb._display_label || nb.label) : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n._display_label || n.label)}</b> ${n._project_path ? `<button type="button" class="vscode-btn" style="margin-left:8px;padding:2px 6px;border:1px solid #888;border-radius:3px;background:#fff;color:#333;font-size:13px;cursor:pointer;vertical-align:middle" data-vscode-path="${esc(n._project_path)}" title="Open project in a new VS Code window">VSCODE</button>` : ""}</div>
    <div class="field">Type: ${esc(n._project_role || n._file_type || 'unknown')}</div>
   <div class="field">남은 병목: ${esc(n._bottleneck || '—')}</div>
    ${(typeof COAUTHOR_CANDIDATES === 'object' && COAUTHOR_CANDIDATES[nodeId]) ? `<div class="field">공저 후보: <b>${esc(COAUTHOR_CANDIDATES[nodeId])}</b> <span style="color:#999;font-size:13px">교내 · 미확정 (맨 앞이 1순위, 볼트 coauthor_candidate)</span></div>` : ''}
    ${n._intro ? `<div class="field"><b>소개:</b> ${esc(n._intro)}</div>` : ''}
    ${n._graph_role ? `<div class="field">Graph role: <b>${esc(n._graph_role)}</b></div>` : ''}
    ${n._finding_candidate ? `<div class="field">Finding candidate: <b>${esc(n._finding_candidate)}</b></div>` : ''}
    <div class="field">Paper quality: <b>${esc(n._quality || '—')}</b></div>
    ${n._quality_note ? `<div class="field" style="font-size:14px;color:#666">${esc(n._quality_note)}</div>` : ''}
    <div class="field">Source: ${esc(n._source_file || '-')}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:14px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Neighbor links use a data attribute + one delegated listener rather than an
// inline onclick. A node id/label sourced from a document or a scraped URL
// (graphify add) can contain a double-quote; dropping the stringified id
// unescaped into a quoted onclick both broke every link and allowed a hostile
// source to inject an event handler into the local report (stored XSS, #1838).
// esc() on data-nid keeps the value inside the attribute; the listener reads it
// back verbatim. Bound to document so it survives the innerHTML rebuild that
// recreates #neighbors-list on each showInfo().
document.addEventListener('click', e => {
  const el = e.target.closest('.neighbor-link');
  if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
});

// VSCODE_BUTTON_BEGIN
document.addEventListener('click', e => {
  const button = e.target.closest('.vscode-btn');
  if (!button) return;
  e.preventDefault();
  e.stopPropagation();
  const projectPath = button.dataset.vscodePath;
  if (!projectPath) return;
  const normalized = projectPath.replace(/\\/g, '/').replace(/\/+$/, '');
  const uri = 'vscode://file/' + encodeURI(normalized) + '/?windowId=_blank';
  window.open(uri, '_blank', 'noopener');
});
// VSCODE_BUTTON_END
// Track hovered node — hover detection is more reliable than click params
let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});
network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  }
});

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const hiddenCommunities = new Set();

const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  applyVisibility();
  updateSelectAllState();
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    applyVisibility();
    updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color};border:1px solid ${c.border || c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});
</script>
<script>
// Render hyperedges as shaded regions
const hyperedges = [{"label": "3D프린팅", "kind": "topic", "nodes": ["Tomo_SFTF", "Tomo_SFTFSoft", "SFTF_Clustering", "SFTFSoft_GNN", "SFTF_QEM", "SFTF_ActiveOverprint"], "color": "#0f766e", "labelColor": "#115e59", "fillAlpha": 0.06, "strokeAlpha": 0.85, "labelAlpha": 0.95, "lineWidth": 3, "dash": [12, 6], "scale": 1.14}, {"label": "Rendering", "kind": "topic", "nodes": ["Tomo_DFSVR", "SFTFSoft_DFSVR", "SFTFSoft_GNN_DFSVR", "DFSVR_VisCull", "PFTF_VisCull_kDop"], "color": "#4338ca", "labelColor": "#3730a3", "fillAlpha": 0.06, "strokeAlpha": 0.85, "labelAlpha": 0.95, "lineWidth": 3, "dash": [12, 6], "scale": 1.1}, {"label": "Drape", "kind": "topic", "nodes": ["cfmsMiindo", "cfmsDrape", "cfmsCIPC", "cfmsPINNDrape", "cfmsPINNCAD", "cfmsDrapeInverse", "SFTF_DrapePrior", "PFTF_DrapePrior_VisCull_kDop"], "color": "#ea580c", "labelColor": "#c2410c", "fillAlpha": 0.06, "strokeAlpha": 0.85, "labelAlpha": 0.95, "lineWidth": 3, "dash": [12, 6], "scale": 1.1}, {"label": "이희란 교수님", "kind": "coauthor", "nodes": ["PFTF_Compression", "cfmsAutoPlace_IJCST", "cfmsAutoPlace_JCDE", "cfmsDrapeSCAN"], "color": "#7c3aed", "labelColor": "#6d28d9", "fillAlpha": 0.035, "strokeAlpha": 0.8, "labelAlpha": 0.95, "lineWidth": 2.5, "dash": [8, 5], "scale": 1.1}, {"label": "은종현 교수님", "kind": "coauthor", "nodes": ["SFTF_Composite", "PFTF_GFiberCT", "TSE_SEM1_Bezier", "TSE_SEM2_Tensor", "SFTF_HeatMethod", "PFTF_AsymTensor", "cfmsDispersityProp"], "color": "#db2777", "labelColor": "#be185d", "fillAlpha": 0.035, "strokeAlpha": 0.8, "labelAlpha": 0.95, "lineWidth": 2.5, "dash": [8, 5], "scale": 1.1}, {"label": "김우석 교수님", "kind": "coauthor", "nodes": ["SFTF_SewerPOC", "ColdOndol", "ColdOndol_Positioning", "SFTF_UrbanTraffic"], "color": "#65a30d", "labelColor": "#4d7c0f", "fillAlpha": 0.035, "strokeAlpha": 0.8, "labelAlpha": 0.95, "lineWidth": 2.5, "dash": [8, 5], "scale": 1.1}, {"label": "전석진 교수님", "kind": "coauthor", "nodes": ["Jeon_DLPOrient"], "color": "#b45309", "labelColor": "#92400e", "fillAlpha": 0.035, "strokeAlpha": 0.8, "labelAlpha": 0.95, "lineWidth": 2.5, "dash": [8, 5], "scale": 1.1}, {"label": "방대석 교수님", "kind": "coauthor", "nodes": ["PFTF_Mold", "SFTF_InjMold"], "color": "#0284c7", "labelColor": "#0369a1", "fillAlpha": 0.035, "strokeAlpha": 0.8, "labelAlpha": 0.95, "lineWidth": 2.5, "dash": [8, 5], "scale": 1.1}];
const CURATED_HYPEREDGE_MEMBERS = {"이희란 교수님": ["cfmsAutoSew", "HIPDetect", "TSE_TomoSh4", "TSE_TomoSh5"], "은종현 교수님": ["SFTF_Holonomy", "cfmsDispersity"]};
Object.entries(CURATED_HYPEREDGE_MEMBERS).forEach(([label, nodeIds]) => {
  const hyperedge = hyperedges.find(item => item.label === label);
  if (!hyperedge) return;

/* 훌의 모서리를 둥글린다 (2026-09-19, 사용자 요청 — 각진 다각형이 보기 싫다).

   곡률은 **제일 작은 노드의 반지름**이다(사용자 지시). vis 는 node.size 를 반지름으로
   쓰므로 보이는 노드의 최소 size 가 곧 그 값이다. 상수를 두 벌 두지 않으려고 숫자를
   박지 않고 노드에서 읽는다 — 진도 사다리(SIZE_MIN 14 → SIZE_MAX 34)가 바뀌면 따라온다.

   꼭짓점마다 arcTo 로 돌되 반지름을 그 모서리가 감당할 만큼으로 줄인다. 좁은 각이나 짧은
   변에서 그대로 쓰면 접점이 변 밖으로 나가 외곽선이 튄다. 멤버가 1~2 인 훌은 위에서 패딩
   링으로 부풀려 이미 꼭짓점이 많은데, 그때는 각이 완만해 보정이 거의 없고 모양도 그대로다.
   그래서 노드 개수와 무관하게 같은 코드가 돈다. */
function _smallestNodeRadius() {
  let min = Infinity;
  nodesDS.get({filter: n => !n.hidden}).forEach(n => {
    const s = Number(n.size);
    if (s > 0 && s < min) min = s;
  });
  return Number.isFinite(min) ? min : 14;
}

function _roundedPolyPath(ctx, pts, radius) {
  const n = pts.length;
  if (n < 3 || !(radius > 0)) {                  // 점·선분은 둥글릴 모서리가 없다
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    return;
  }
  // 꼭짓점 P 의 접점은 모서리에서 r / tan(내각/2) 만큼 떨어진다. 그 거리가 이웃 변의
  // 절반을 넘지 않도록 r 을 줄인다 — 그래야 옆 모서리의 호와 겹치지 않는다.
  const radii = pts.map((p, i) => {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const ax = a.x - p.x, ay = a.y - p.y, la = Math.hypot(ax, ay);
    const bx = b.x - p.x, by = b.y - p.y, lb = Math.hypot(bx, by);
    if (!la || !lb) return 0;
    const cos = Math.max(-1, Math.min(1, (ax * bx + ay * by) / (la * lb)));
    const tanHalf = Math.tan(Math.acos(cos) / 2);
    if (!(tanHalf > 1e-6)) return 0;             // 되돌아가는 뾰족점은 둥글리지 않는다
    return Math.min(radius, tanHalf * Math.min(la, lb) / 2);
  });
  // 변의 중점에서 시작해 꼭짓점마다 arcTo 로 돈다.
  const mid = (a, b) => ({x: (a.x + b.x) / 2, y: (a.y + b.y) / 2});
  const start = mid(pts[0], pts[1]);
  ctx.moveTo(start.x, start.y);
  for (let i = 1; i <= n; i++) {
    const cur = pts[i % n], nxt = pts[(i + 1) % n];
    const m = mid(cur, nxt);
    ctx.arcTo(cur.x, cur.y, m.x, m.y, radii[i % n]);
  }
  ctx.closePath();
}

// HYPEREDGE_LABEL_HELPERS_BEGIN
function _boxOverlapArea(a, b) {
  const w = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
  const h = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
  return w * h;
}
function _nodeLabelBoxes() {
  return RAW_NODES.map(n => {
    const b = network.getBoundingBox(n.id);
    return b && {left: b.left - 6, right: b.right + 6, top: b.top - 6, bottom: b.bottom + 6};
  }).filter(Boolean);
}
function _hyperedgeViewportBounds() {
  const pad = 14;
  const tl = network.DOMtoCanvas({x: pad, y: pad});
  const br = network.DOMtoCanvas({x: Math.max(pad, container.clientWidth - pad),
                                  y: Math.max(pad, container.clientHeight - pad)});
  return {left: Math.min(tl.x, br.x), right: Math.max(tl.x, br.x),
          top: Math.min(tl.y, br.y), bottom: Math.max(tl.y, br.y)};
}
function _drawHyperedgeLabel(ctx, h, polygon, cx, cy, nodeBoxes, placedBoxes, viewport) {
  ctx.font = 'bold 20px sans-serif';
  const textWidth = ctx.measureText(h.label).width;
  const textHeight = 22;
  let best = null;
  for (let i = 0; i < polygon.length; i++) {
    const a = polygon[i], b = polygon[(i + 1) % polygon.length];
    const dx = b.x - a.x, dy = b.y - a.y;
    const length = Math.hypot(dx, dy);
    if (length < 1) continue;
    const ux = dx / length, uy = dy / length;
    let nx = -uy, ny = ux;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }
    let angle = Math.atan2(dy, dx);
    if (angle > Math.PI / 2) angle -= Math.PI;
    if (angle < -Math.PI / 2) angle += Math.PI;
    const ca = Math.abs(Math.cos(angle)), sa = Math.abs(Math.sin(angle));
    const halfW = (ca * textWidth + sa * textHeight) / 2;
    const halfH = (sa * textWidth + ca * textHeight) / 2;
    // 12px puts the 22px text box about 1px outside the hull edge. Larger
    // offsets are fallbacks only when a node/title collision requires them.
    for (const offset of [12, 18, 26, 38, 52]) {
      const x = mx + nx * offset, y = my + ny * offset;
      const box = {left: x - halfW, right: x + halfW, top: y - halfH, bottom: y + halfH};
      const nodeOverlap = nodeBoxes.reduce((sum, other) => sum + _boxOverlapArea(box, other), 0);
      const labelOverlap = placedBoxes.reduce((sum, other) => sum + _boxOverlapArea(box, other), 0);
      const overflow = Math.max(0, viewport.left - box.left) + Math.max(0, box.right - viewport.right)
                     + Math.max(0, viewport.top - box.top) + Math.max(0, box.bottom - viewport.bottom);
      const shortfall = Math.max(0, textWidth + 18 - length);
      const proximityPenalty = (offset - 12) * 2000;
      const score = nodeOverlap * 1000 + labelOverlap * 200 + overflow * overflow * 1000
                  + shortfall * shortfall * 2 + proximityPenalty;
      if (!best || score < best.score) best = {x, y, angle, box, score};
    }
  }
  if (!best) return;
  placedBoxes.push(best.box);
  ctx.save();
  ctx.translate(best.x, best.y);
  ctx.rotate(best.angle);
  ctx.globalAlpha = h.labelAlpha == null ? 0.8 : h.labelAlpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeText(h.label, 0, 0);
  ctx.fillStyle = h.labelColor || h.color || '#6366f1';
  ctx.fillText(h.label, 0, 0);
  ctx.restore();
}
// HYPEREDGE_LABEL_HELPERS_END
// afterDrawing passes ctx already transformed to network coordinate space.
// Draw node positions raw — no manual pan/zoom/DPR math needed.
network.on('afterDrawing', function(ctx) {
    if (!showHyper) return;   // 'hyperedge' 체크박스 — hull 과 영역 간 화살표를 함께 끈다
    const nodeLabelBoxes = _nodeLabelBoxes();
    const placedHyperedgeLabelBoxes = [];
    const hyperedgeViewport = _hyperedgeViewportBounds();
    const cornerR = _smallestNodeRadius();   // 훌 모서리의 곡률 — 한 프레임에 한 번만 잰다
    // Draw the base hull first so application-region hulls remain readable
    // where the two sets overlap.  Array order is preserved for the finding
    // dependency indices below.
    const hyperedgesForDrawing = hyperedges.slice().sort((a, b) => {
        const rank = h => h.kind === 'base' ? 0 : (h.kind === 'role' ? 1 : 2);
        return rank(a) - rank(b);
    });
    hyperedgesForDrawing.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 1) return;
        ctx.save();
        const color = h.color || '#6366f1';
        const fillAlpha = h.fillAlpha == null ? 0.12 : h.fillAlpha;
        const strokeAlpha = h.strokeAlpha == null ? 0.4 : h.strokeAlpha;
        const labelAlpha = h.labelAlpha == null ? 0.8 : h.labelAlpha;
        const scale = h.scale == null ? 1.25 : h.scale;
        ctx.globalAlpha = fillAlpha;
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = h.lineWidth == null ? 2 : h.lineWidth;
        ctx.setLineDash(h.dash || []);
        ctx.beginPath();
        // CONVEX hull (Andrew monotone chain), then expand from centroid.
        // 소집합(멤버<=2) hull은 선분으로 퇴화 — 멤버 주위 패딩 링을 합쳐
        // 캡슐형 영역으로 부풀린다 (발견4·5·6 가독성, 2026-07-22).
        let srcPts = positions;
        const degen = positions.length <= 2;
        if (degen) {
            const PAD = 60, K = 16;
            srcPts = [];
            positions.forEach(p => {
                for (let k = 0; k < K; k++) {
                    const a = 2 * Math.PI * k / K;
                    srcPts.push({x: p.x + PAD * Math.cos(a), y: p.y + PAD * Math.sin(a)});
                }
            });
        }
        const pts = srcPts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
        const lower = [];
        for (const p of pts) {
            while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
            lower.push(p);
        }
        const upper = [];
        for (let i = pts.length - 1; i >= 0; i--) {
            const p = pts[i];
            while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
            upper.push(p);
        }
        const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
        const cx = hull.reduce((s, p) => s + p.x, 0) / hull.length;
        const cy = hull.reduce((s, p) => s + p.y, 0) / hull.length;
        const expanded = hull.map(p => ({
            x: cx + (p.x - cx) * (degen ? 1.0 : scale),
            y: cy + (p.y - cy) * (degen ? 1.0 : scale)
        }));
        _roundedPolyPath(ctx, expanded, cornerR);
        ctx.fill();
        ctx.globalAlpha = strokeAlpha;
        ctx.stroke();
        // Label: choose a hull edge and follow its direction while avoiding nodes.
        _drawHyperedgeLabel(ctx, h, expanded, cx, cy, nodeLabelBoxes, placedHyperedgeLabelBoxes, hyperedgeViewport);
        ctx.setLineDash([]);
        ctx.restore();
    });
// FINDING_DEPS_BEGIN — 발견 간 의존성 (분류표 노트의 DAG, layout_findings.py 정본)
// 2026-09-14: 비웠다. 이 화살표들은 발견1~6 영역 **사이**의 의존성이었는데 그 영역을
// 걷어냈다(인덱스로 가리키던 대상이 없다). 공저자 묶음 사이에는 그런 의존이 없다.
// 노드 사이의 개발 목표 엣지와 캡션은 이것과 무관하며 그대로다.
// 아래 그리기 코드는 남겨 둔다 — 나중에 영역 간 관계를 다시 그릴 일이 생기면 여기에 적는다.
const FINDING_DEPS = [];
function _regionCentroid(h) {
  const ps = h.nodes.map(nid => network.getPositions([nid])[nid]).filter(p => p);
  return {x: ps.reduce((s,p)=>s+p.x,0)/ps.length,
          y: ps.reduce((s,p)=>s+p.y,0)/ps.length};
}
(function(ctx) {
  ctx.save();
  FINDING_DEPS.forEach(dp => {
    const a = _regionCentroid(hyperedges[dp.from]);
    const b = _regionCentroid(hyperedges[dp.to]);
    const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy);
    const ux = dx/L, uy = dy/L;
    const x1 = a.x+ux*115, y1 = a.y+uy*115;   // 영역 라벨을 피해 안쪽에서 시작/끝
    const x2 = b.x-ux*135, y2 = b.y-uy*135;
    // 전부 dashed + 5배 두께 + 반투명: 노드 간 실선 엣지와 확실히 구분
    ctx.beginPath();
    ctx.lineWidth = dp.style === "double" ? 15 : 8;
    ctx.strokeStyle = dp.style === "contrast" ? "#8a8a5e" : "#a5a8f5";
    ctx.setLineDash(dp.style === "dotted" ? [4,10]
                    : dp.style === "double" ? [22,14]
                    : dp.style === "contrast" ? [10,12] : [14,10]);
    ctx.globalAlpha = 0.22;
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    if (dp.style !== "contrast") {            // 화살촉 (두께에 맞춰 확대)
      const ah = dp.style === "double" ? 34 : 26;
      ctx.beginPath();
      ctx.moveTo(x2+ux*10,y2+uy*10);
      ctx.lineTo(x2-ux*ah-uy*ah*0.45, y2-uy*ah+ux*ah*0.45);
      ctx.lineTo(x2-ux*ah+uy*ah*0.45, y2-uy*ah-ux*ah*0.45);
      ctx.closePath();
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    }
  });
  ctx.restore();
})(ctx);
// 발견 영역 라벨 왼쪽에 사다리 글리프(0차·1차·2차·topology) — 시그니처 다이어그램과 동일 모티프
// 2026-09-14: 영역 캡션 옆 기호(REGION_GLYPHS·_glyph)를 걷어냈다.
// 0차·2차·소거·게이트 같은 발견1~5 의 어휘였는데, 그 표는 **배열 순서(index)** 로 훌에
// 붙는다. 훌을 3D프린팅·공저자로 갈아 끼운 뒤에도 그 자리에 그대로 달려서, 뜻이 없는
// 작은 점·화살표·타원 넷이 새 캡션 옆에 남아 있었다(사용자 보고).
// FINDING_DEPS_END
});
</script>
<script>
/* ====================== 투고 진도 아이콘 ======================
   mindmap.html 과 같은 규칙: 투고 1/2 · 게재확정 3/4 · 인쇄중 7/8 · 출판 꽉 찬 원+체크.
   값은 노트 frontmatter 의 mindmap_status 이고, layout_findings.py 가 아래
   MINDMAP_STATUS 를 채운다(빈 객체면 아직 생성 전이라는 뜻).

   afterDrawing 을 hull 쪽과 **따로** 등록한다. 그쪽 핸들러는 맨 앞에
   `if (!showHyper) return;` 가 있어서 같이 넣으면 'hyperedge' 를 끌 때 배지까지
   사라진다. 나중에 등록해야 hull 위에 그려지는 것도 이 자리라야 한다. */
const MINDMAP_STATUS = {"SFTF_DrapePrior": "submitted", "Tomo_SFTF": "submitted", "cfmsCIPC": "submitted"};
/* 2026-09-12: 색을 둘로 갈랐다. 넷 다 초록이던 때는 초록이 너무 많아 「저널에 가 있는 것」과
   「끝난 것」이 한 색으로 뭉쳤다. 이제 published 만 초록이고 나머지 셋은 노랑이다 —
   셋끼리는 파이가 찬 정도로 가른다. mindmap.html · 볼트 「투고」 열도 같은 규칙이다. */
const PROG_GREEN = '#16a34a';    // 출판(끝난 것)
const PROG_YELLOW = '#eab308';   // 저널 손에 가 있는 단계(투고·게재확정·인쇄중)
const PROG = {
  submitted: { frac: 0.5,   color: PROG_YELLOW, label: '투고(submitted)' },
  accepted:  { frac: 0.75,  color: PROG_YELLOW, label: '게재확정(accepted)' },
  inprint:   { frac: 0.875, color: PROG_YELLOW, label: '인쇄중(in print)' },
  published: { done: true,  color: PROG_GREEN,  label: '출판(published)' },
};

/* 노드 파이의 단계표 (2026-09-13).
   위 PROG 넷만으로는 노드 대부분이 그려지지 않는다 — 이 볼트의 프로젝트는 대개 draft 라서
   옛 배지 규칙에서는 아이콘이 아예 없었다(그래서 Tomo_SFTF 만 파이로 바뀌어 보였다).
   그래서 **볼트의 통합 단계 어휘 아홉 가지를 그대로** 들여온다. 볼트 대시보드의 파이단계와
   같은 기하이고, 색은 여기서 정하지 않는다 — 노드의 등급 색을 쓴다. */
const STAGE_PIE = {
  published: { frac: 1,     done: true, label: '출판(published)' },
  inprint:   { frac: 0.875,             label: '인쇄중(in print)' },
  accepted:  { frac: 0.75,              label: '게재확정(accepted)' },
  revision:  { frac: 0.625,             label: '심사 수정(revision)' },
  submitted: { frac: 0.5,               label: '투고(submitted)' },
  draft:     { frac: 0.25,              label: '초고(draft)' },
  /* 2026-09-14: 미정·보류를 가르는 기준이 바뀌었다(사용자). 전에는 **낼 곳**이 기준이라
     「게재지 미정」이 undecided 였다. 이제는 **손을 댔는가**가 기준이다 — 아예 시작하지
     않은 것만 미정이고, 하다가 미뤄 둔 것은 보류다. 범례에 그 뜻을 적어 둔다. */
  undecided: { frac: 0,                 label: '미정(undecided) · 원고 없음' },
  // 2026-09-18: x 의 그림이 빗금 한 획에서 ⛔(꽉 찬 원 + 가로 막대)로 바뀌었다. 뜻은 그대로다.
  blocked:   { frac: 0,     x: true,    label: '보류(blocked) · 하다가 미룸' },
  cancelled: { frac: 0,     xx: true,   label: '취소(cancelled)' },
  idea:      { frac: 0,                 label: '아이디어(idea)' },
};
/* 노드별 단계. 파일에 구운 볼트 값(VAULT_STAGES)으로 시작하고, Supabase 표가 살아 있으면
   아래 오버라이드가 최신 값으로 덮는다. 표에도 볼트에도 없는 노드는 꽉 찬 원으로 남는다. */
const NODE_STAGE = Object.assign({}, typeof VAULT_STAGES === 'object' ? VAULT_STAGES : {});

/* 노드 지름 = 투고 진도 (2026-09-14).
   전에는 graphify 가 실어 준 차수(degree) 비례였다. 화면에서 큰 노드는 「연결이 많은 것」이
   아니라 「멀리 간 원고」여야 한다는 사용자 판단이다. 미정·보류·취소, 그리고 단계를 모르는
   노드가 가장 작고 초고 → 투고 → 심사 수정 → 게재확정 → 인쇄중 → 출판 순으로 커진다.
   비율은 파이가 쓰는 STAGE_PIE.frac 을 그대로 쓴다 — 채운 정도와 지름이 같은 사다리를 탄다
   (초고 19 · 투고 24 · 심사 수정 26.5 · 게재확정 29 · 인쇄중 31.5 · 출판 34). */
const SIZE_MIN = 14, SIZE_MAX = 34;
function stageSize(nodeId) {
  const stage = STAGE_PIE[NODE_STAGE[nodeId]];
  return SIZE_MIN + (SIZE_MAX - SIZE_MIN) * (stage ? (stage.frac || 0) : 0);
}
function applyStageSizes() {
  // 부분 갱신(merge)이라 색·라벨 같은 다른 필드는 건드리지 않는다.
  nodesDS.update(RAW_NODES.map(n => ({ id: n.id, size: stageSize(n.id) })));
}
applyStageSizes();

/* mindmap.html progIcon() 의 비율을 그대로 옮긴 것. r=6 기준으로
   링 폭 1.6(0.267r) · 흰 테두리 중심 7.4(1.233r)·폭 1.2(0.2r) · 완료형 6.6(1.1r).
   색은 단계가 정한다(p.color) — 옛 배지 데이터에 color 가 없으면 초록으로 떨어진다. */
function drawProgBadge(ctx, cx, cy, R, p) {
  const col = p.color || PROG_GREEN;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const outline = (rad) => {                 // 어느 배경에서도 실루엣이 떨어지게
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, 2 * Math.PI);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.2 * R;
    ctx.stroke();
  };
  if (p.done) {
    outline(1.1 * R);
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 0.48 * R, cy + 0.03 * R);
    ctx.lineTo(cx - 0.13 * R, cy + 0.40 * R);
    ctx.lineTo(cx + 0.52 * R, cy - 0.33 * R);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.30 * R;
    ctx.stroke();
  } else {
    outline(1.233 * R);
    ctx.beginPath();                          // 12시에서 시계방향으로 채운다
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * p.frac);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.267 * R;
    ctx.stroke();
  }
  ctx.restore();
}

/* 노드 자체가 진도 파이다 (2026-09-13).
   전에는 등급 색 원을 그리고 그 오른쪽 위 어깨에 진도 배지를 따로 얹었다. 둘을 합쳤다 —
   **모양(채운 정도)은 투고 진도, 색은 논문 등급**이고, 크기는 예전 원 그대로(degree).
   진도가 없는 노드는 지금까지처럼 꽉 찬 원으로 남는다. 그래야 대부분의 노드에서
   「꽉 찬 원 = 아직 안 나간 원고」라는 읽기가 유지된다. */
function nodeFillColor(n) {
  const c = n.color && (n.color.background || n.color);
  return typeof c === 'string' ? c : '#999999';
}
function nodeStrokeColor(n) {
  const c = n.color && n.color.border;
  return typeof c === 'string' ? c : null;
}

/* 진도 자국을 그릴 색 (2026-09-14).
   파이는 흰 원을 깔고 그 위에 **등급 색**으로 자국을 낸다. 그런데 ToDo 등급의 색은
   흰색이라(QUALITY_COLORS.ToDo = #ffffff) 흰 바탕에 흰 자국이 되어 아무것도 안 보인다.
   cfmsDrapeSCAN 이 보류인데 화면에서는 미정(빈 원)과 똑같아 보인 것이 이 때문이고,
   ToDo 노드 다섯이 전부 같은 처지였다 — 단계를 갖고 있는데 그리지 못하고 있었다.
   너무 밝으면 테두리 색으로 그린다. ToDo 의 테두리는 검정이라 그대로 쓸 수 있다. */
function pieInk(fill, border) {
  const m = /^#([0-9a-f]{6})$/i.exec(fill || '');
  if (!m) return fill;
  const v = parseInt(m[1], 16);
  const lum = 0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255);
  return lum > 230 ? (border || '#333333') : fill;
}

function drawNodePie(ctx, cx, cy, R, p, color, border) {
  const ink = pieInk(color, border);
  // 마지막에 두르는 등급 테두리의 색. 보통은 등급 색 그대로지만, 아래 ⛔ 가지에서
  // 원을 먹색으로 채우는 경우(ToDo)에는 흰 테두리가 먹색 원을 파고들므로 먹색으로 바꾼다.
  let ringColor = color;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // vis 가 그려 둔 꽉 찬 원을 덮는다. 남은 흰 부분이 「아직」을 뜻한다.
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  if (p.done) {
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();                          // 완료 체크
    ctx.moveTo(cx - 0.48 * R, cy + 0.03 * R);
    ctx.lineTo(cx - 0.13 * R, cy + 0.40 * R);
    ctx.lineTo(cx + 0.52 * R, cy - 0.33 * R);
    // 꽉 찬 원 위의 체크는 흰색이다. 다만 원 자체가 흰색이면(ToDo) 그때는 먹색으로.
    ctx.strokeStyle = ink === color ? '#ffffff' : ink;
    ctx.lineWidth = 0.22 * R;
    ctx.stroke();
  } else if (p.x) {
    /* 보류는 ⛔ 다 (2026-09-18, 사용자 지시). 그전에는 빗금 한 획이라 취소의 X 와 한 획
       차이였고, 보류 노드는 지름이 가장 작아(frac 0) 그 한 획이 구별되지 않았다.
       꽉 찬 원 + 가로 막대는 작은 원에서도 「멈춤」으로 읽힌다.
       2026-09-18: 채우는 색을 등급 색이 아니라 **먹색(pieInk)** 으로 바꿨다. 등급 색을
       그대로 쓰면 ToDo 는 흰 원 + 먹색 막대가 되어, 같은 보류인 cfmsPINNCAD(파랑)·
       SFTFSoft_DFSVR(주황) 의 꽉 찬 ⛔ 와 아예 다른 그림으로 보였다(사용자 보고 —
       cfmsDrapeSCAN). pieInk 는 밝지 않은 등급 색은 그대로 돌려주므로 다른 보류 노드의
       모양은 바뀌지 않고, 너무 밝은 등급(ToDo=흰색)만 테두리 색으로 채워진다. */
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.fillStyle = ink;
    ctx.fill();
    ringColor = ink;
    ctx.beginPath();
    ctx.moveTo(cx - 0.583 * R, cy);
    ctx.lineTo(cx + 0.583 * R, cy);
    // 원이 언제나 꽉 차 있으므로 막대는 언제나 흰색이다.
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.40 * R;
    ctx.stroke();
  } else if (p.xx) {
    // 취소는 X(접었음) 그대로다. 볼트 대시보드와 같은 구분이다.
    ctx.strokeStyle = ink;
    ctx.lineWidth = 0.16 * R;
    ctx.beginPath();
    ctx.moveTo(cx - 0.5 * R, cy + 0.5 * R);
    ctx.lineTo(cx + 0.5 * R, cy - 0.5 * R);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 0.5 * R, cy - 0.5 * R);
    ctx.lineTo(cx + 0.5 * R, cy + 0.5 * R);
    ctx.stroke();
  } else {
    ctx.beginPath();                          // 12시에서 시계방향으로 채운다
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * p.frac);
    ctx.closePath();
    ctx.fillStyle = ink;
    ctx.fill();
  }
  // 테두리는 언제나 등급 색이다 — 파이가 비어 있어도 노드의 등급이 읽힌다.
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.93, 0, 2 * Math.PI);
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = 0.14 * R;
  ctx.stroke();
  ctx.restore();
}

/* 진도 파이 깜빡임 (2026-09-19, 사용자 요청 — 진도가 나아갈수록 더 빨리 깜빡인다).

   주기는 크기와 같은 frac 사다리를 타되 **반대 방향**이다: frac 0(미정·보류·취소)이
   2400ms, 출판이 800ms. 제일 빠른 것이 1.25Hz 로, 초당 3회를 넘기면 광과민성 발작 유발
   기준(WCAG 2.3.1)에 걸리므로 그 아래로 잡았다. portfolio.html·mindmap.html 도 같은
   식이라 세 화면이 같은 박자로 뛴다.

   '꺼짐' 반주기에는 파이를 **안 그린다**. vis 가 깔아 둔 등급 색 원은 그대로 남으므로
   노드가 사라지지 않고 진도 표시만 깜빡인다 — 진도가 없는 노드와 같은 그림이 된다.

   canvas 라서 CSS 애니메이션을 못 쓴다. 60fps 로 계속 다시 그리는 대신 **다음 전환 시각**
   에만 redraw 를 건다(화면에 있는 주기들의 반주기 경계 중 가장 이른 것). 지금 배치에서는
   초당 열 번 남짓이다. 그래프가 숨어 있으면(인접행렬 뷰) 그리지 않고 일정만 이어 간다. */
const BLINK_T_SLOW = 2400, BLINK_T_FAST = 800;
const BLINK_KEY = 'graphify_graph_blink_v1';
/* 깜빡이는 단계는 **저널 손에 가 있고 아직 결판이 안 난** 셋뿐이다 (2026-09-19, 사용자
   지시 — 전부 깜빡이니 정신이 없다). 쓰는 중(draft)과 끝난 것(published)은 가만히 둔다.
   미정·보류·취소·아이디어도 마찬가지다 — 멈춰 있는 것들이고 수가 많아 소음의 대부분이었다.
   인쇄중(inprint)은 사용자가 든 목록에 없어 함께 빼 두었다. 한 줄만 고치면 넣을 수 있다. */
const BLINK_STAGES = new Set(['submitted', 'revision', 'accepted']);
function blinkPeriod(stage) {
  const frac = stage ? (stage.done ? 1 : (stage.x || stage.xx ? 0 : (stage.frac || 0))) : 0;
  return BLINK_T_SLOW - (BLINK_T_SLOW - BLINK_T_FAST) * frac;
}
/* 기본은 켜짐이다(사용자 지시). 끄고 싶은 사람은 스위치로 끄고 그 선택이 이 브라우저에
   남는다 — WCAG 2.2.2 가 요구하는 「멈출 수 있을 것」은 그 스위치가 만족시키고, 2.3.1 의
   초당 3회 기준은 제일 빠른 주기가 1.25Hz 라 넘지 않는다. */
let blinkOn = true;
try { if (localStorage.getItem(BLINK_KEY) === '0') blinkOn = false; } catch (e) {}
function blinkShowing(key, stage) {
  if (!blinkOn || !BLINK_STAGES.has(key)) return true;
  const T = blinkPeriod(stage);
  return (Date.now() % T) < T / 2;
}
let blinkTimer = null;
function scheduleBlink() {
  clearTimeout(blinkTimer);
  if (!blinkOn) return;
  const now = Date.now();
  const halves = new Set();
  nodesDS.get({ filter: (n) => !n.hidden }).forEach((n) => {
    const key = STAGE_PIE[NODE_STAGE[n.id]] ? NODE_STAGE[n.id] : MINDMAP_STATUS[n.id];
    if (!BLINK_STAGES.has(key)) return;              // 안 깜빡이는 단계는 일정에 넣지 않는다
    const st = STAGE_PIE[key] || PROG[key];
    if (st) halves.add(blinkPeriod(st) / 2);
  });
  if (!halves.size) return;
  let wait = Infinity;
  halves.forEach(h => { wait = Math.min(wait, h - (now % h)); });
  blinkTimer = setTimeout(() => {
    const g = document.getElementById('graph');
    if (!g || g.style.display !== 'none') network.redraw();
    scheduleBlink();
  }, Math.max(16, wait));
}
(function installBlinkToggle() {
  const cb = document.getElementById('blink-cb');
  if (!cb) return;
  cb.checked = blinkOn;
  cb.addEventListener('change', () => {
    blinkOn = cb.checked;
    try { localStorage.setItem(BLINK_KEY, blinkOn ? '1' : '0'); } catch (e) {}
    clearTimeout(blinkTimer);
    network.redraw();                // 끄면 전부 다시 보이게, 켜면 즉시 박자를 타게
    scheduleBlink();
  });
})();
scheduleBlink();

network.on('afterDrawing', function (ctx) {
  nodesDS.get({ filter: (n) => !n.hidden }).forEach((n) => {
    // 볼트/표의 단계가 먼저다. 옛 4단계 배지 데이터(MINDMAP_STATUS)는 그것이 없을 때만.
    const key = STAGE_PIE[NODE_STAGE[n.id]] ? NODE_STAGE[n.id] : MINDMAP_STATUS[n.id];
    const p = STAGE_PIE[key] || PROG[key];
    if (!p) return;
    if (!blinkShowing(key, p)) return;         // 깜빡임의 '꺼짐' 반주기
    if (n.shape === 'circle') return;          // 종료 노드(×)는 라벨이 원 안에 있어 덮으면 안 된다
    const pos = network.getPositions([n.id])[n.id];
    if (!pos) return;
    drawNodePie(ctx, pos.x, pos.y, n.size || 12, p, nodeFillColor(n), nodeStrokeColor(n));
  });
});

/* 정렬 안내선 — 끄는 노드가 이웃과 줄이 맞으면 상하·좌우로 점선을 긋는다
   (2026-09-19, 사용자 요청). 상태를 만드는 곳은 위쪽 installLiveSnap 옆의
   computeAlignGuides 이고, 여기는 그리기만 한다. 훌·엣지·노드 파이 **뒤에** 등록해야
   그 위로 올라온다 — vis 는 afterDrawing 을 붙인 순서대로 부른다.

   ctx 는 이미 캔버스 좌표로 변환돼 있으므로 선 두께와 점선 간격을 배율로 나눠야
   확대·축소와 무관하게 화면에서 같은 굵기로 보인다.

   색은 파워포인트의 스마트 가이드처럼 주황빨강이다. 끄는 동안만 잠깐 보이는 가는
   점선이라 등급 색(상 #e02020 · 중 #f28e2b)과 헷갈리지 않는다. */
network.on('afterDrawing', function (ctx) {
  const g = ALIGN_GUIDES;
  if (!g) return;
  const scale = network.getScale() || 1;
  const PAD = 26 / scale;                      // 맞은 노드 바깥으로 조금 더 뻗는다
  ctx.save();
  ctx.strokeStyle = '#e8590c';
  ctx.lineWidth = 1.2 / scale;
  ctx.setLineDash([7 / scale, 5 / scale]);
  if (g.vx !== null) {
    ctx.beginPath();
    ctx.moveTo(g.vx, g.vFrom - PAD);
    ctx.lineTo(g.vx, g.vTo + PAD);
    ctx.stroke();
  }
  if (g.hy !== null) {
    ctx.beginPath();
    ctx.moveTo(g.hFrom - PAD, g.hy);
    ctx.lineTo(g.hTo + PAD, g.hy);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
});

/* 범례: Paper quality 아래에 한 줄. 아이콘은 위 drawProgBadge 를 그대로 써서
   작은 캔버스에 그린다 — 그림을 두 벌 유지하지 않으려고. */
(function () {
  const wrap = document.getElementById('legend-wrap');
  if (!wrap) return;
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:10px;padding-top:8px;border-top:1px solid #e6e6e6';
  const h = document.createElement('h3');
  h.textContent = '투고 진도';
  box.appendChild(h);
  // 2026-09-13: 파이가 노드 자리로 옮겨 가면서 색의 뜻이 바뀌었다. 채운 정도만 진도이고
  // 색은 논문 등급이므로, 범례 아이콘은 색을 빼고(회색) 모양만 보인다.
  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:12px;color:#888;margin:-2px 0 5px;line-height:1.4';
  hint.textContent = '노드의 크기·채운 정도 = 진도 · 색 = 논문 등급';
  box.appendChild(hint);
  const S = 16, dpr = window.devicePixelRatio || 1;

// Keep every edge caption at the lengthwise midpoint of its edge, turned to
// run along that edge.  Only the perpendicular offset changes, so dragging a
// node can resolve collisions without making the caption look attached to
// either endpoint.
function _edgeLabelOverlapArea(a, b) {
  const width = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
  const height = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
  return width * height;
}

function _edgeLabelViewportBounds() {
  const pad = 12;
  const topLeft = network.DOMtoCanvas({x: pad, y: pad});
  const bottomRight = network.DOMtoCanvas({
    x: Math.max(pad, container.clientWidth - pad),
    y: Math.max(pad, container.clientHeight - pad),
  });
  return {
    left: Math.min(topLeft.x, bottomRight.x),
    right: Math.max(topLeft.x, bottomRight.x),
    top: Math.min(topLeft.y, bottomRight.y),
    bottom: Math.max(topLeft.y, bottomRight.y),
  };
}

function _drawDynamicEdgeLabels(ctx) {
  const visibleEdges = RAW_EDGES.map((edge, id) => ({edge, id, view: edgesDS.get(id)}))
    .filter(({edge, view}) => edge.label && view && view.hidden !== true);
  if (!visibleEdges.length) return;

  const positions = network.getPositions();
  const nodeBoxes = nodesDS.get({filter: node => node.hidden !== true})
    .map(node => network.getBoundingBox(node.id))
    .filter(Boolean)
    .map(box => ({
      left: box.left - 6, right: box.right + 6,
      top: box.top - 6, bottom: box.bottom + 6,
    }));
  const viewport = _edgeLabelViewportBounds();
  const placedBoxes = [];
  const offsets = [0, 18, -18, 34, -34, 52, -52, 72, -72];

  ctx.save();
  ctx.font = '600 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  visibleEdges.forEach(({edge}) => {
    const from = positions[edge.from];
    const to = positions[edge.to];
    if (!from || !to) return;
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const length = Math.hypot(dx, dy);
    if (length < 1) return;

    // The along-edge coordinate is always 0.5 (the exact midpoint).
    const midX = (from.x + to.x) / 2;
    const midY = (from.y + to.y) / 2;
    const normalX = -dy / length;
    const normalY = dx / length;
    // Turn the caption along its edge.  Folding the angle into [-90, +90]
    // keeps the text left-to-right: without it, every edge that points
    // leftwards would render its caption upside down.
    let angle = Math.atan2(dy, dx);
    if (angle > Math.PI / 2) angle -= Math.PI;
    if (angle < -Math.PI / 2) angle += Math.PI;
    // The collision box stays axis-aligned, so it has to cover the *rotated*
    // text's extent — a tilted caption is wider and taller than the flat one.
    const textWidth = ctx.measureText(edge.label).width + 10;
    const textHeight = 22;
    const ca = Math.abs(Math.cos(angle)), sa = Math.abs(Math.sin(angle));
    const halfWidth = (ca * textWidth + sa * textHeight) / 2;
    const halfHeight = (sa * textWidth + ca * textHeight) / 2;
    let best = null;

    offsets.forEach(offset => {
      const x = midX + normalX * offset;
      const y = midY + normalY * offset;
      const box = {
        left: x - halfWidth, right: x + halfWidth,
        top: y - halfHeight, bottom: y + halfHeight,
      };
      const nodeOverlap = nodeBoxes.reduce(
        (sum, other) => sum + _edgeLabelOverlapArea(box, other), 0,
      );
      const labelOverlap = placedBoxes.reduce(
        (sum, other) => sum + _edgeLabelOverlapArea(box, other), 0,
      );
      const overflow = Math.max(0, viewport.left - box.left)
        + Math.max(0, box.right - viewport.right)
        + Math.max(0, viewport.top - box.top)
        + Math.max(0, box.bottom - viewport.bottom);
      const score = nodeOverlap * 2000 + labelOverlap * 1200
        + overflow * overflow * 1000 + Math.abs(offset) * 20;
      if (!best || score < best.score) best = {x, y, box, score};
    });

    if (!best) return;
    placedBoxes.push(best.box);
    ctx.save();
    ctx.translate(best.x, best.y);
    ctx.rotate(angle);
    ctx.globalAlpha = 0.96;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.94)';
    ctx.strokeText(edge.label, 0, 0);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillText(edge.label, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

// vis-network redraws continuously while a node is dragged, so this handler
// recomputes collision-free edge-caption positions on every rendered frame.
network.on('afterDrawing', function(ctx) {
  _drawDynamicEdgeLabels(ctx);
});
// EDGE_LABEL_LAYOUT_END
