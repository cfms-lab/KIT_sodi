<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFMS 포트폴리오 한눈에</title>
<!--
  볼트 Dashboards/프로젝트현황.md 의 「포트폴리오 한눈에」 표를 웹에서 보는 페이지다.
  읽기 전용이고 **정본은 옵시디언 볼트**다 — upjuk.html 과 같은 규율이다.

  ⚠️ **이 파일에는 표 데이터가 한 줄도 없다** (2026-09-13). GitHub Pages 는 파일을 누구에게나
  그대로 내주므로, 데이터를 구워 두면 로그인 화면을 씌워도 소스 보기 한 번에 다 읽힌다.
  그래서 표는 Supabase `portfolio_rows` 에 있고, 그 표는 RLS 로 **로그인 사용자에게만** 열린다
  (anon 정책이 아예 없다 — schema_portfolio_rows.sql). 로그인 전에는 받을 데이터 자체가 없다.

  볼트 → 표 발행:  node scripts/publish-portfolio.mjs --push
  표의 행을 만드는 규칙(투고순서 맵·분리트랙·투고 단계 해석)은 볼트 노트의 dataviewjs 에 있고,
  이 파일에는 **그리는 규칙(정렬·아이콘·레이아웃)만** 있다.
-->
<style>
  :root{
    --line:#e2e8f0; --ink:#0f172a; --dim:#64748b; --bg:#f8fafc;
    /* 등급 색 — graph.html 의 QUALITY_COLORS 와 같은 값이다. 세 페이지가 같은 언어를 쓴다. */
    --q-high:#e02020; --q-medium:#f28e2b; --q-low:#2a78d6;
    --q-todo:#ffffff; --q-closed:#6b7280; --q-group:#c8c8c8; --q-none:#94a3b8;
  }
  *{box-sizing:border-box}
  /* 클래스의 display:flex 가 UA 의 [hidden]{display:none} 을 이겨서, 로그인 전에
     툴바·범례가 그대로 보이던 것을 막는다 (2026-09-13). */
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
    font-family:"Segoe UI","Malgun Gothic",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header a.home{color:#334155;text-decoration:none;background:#f1f5f9;border:1px solid var(--line);
    padding:4px 10px;border-radius:10px;font-size:13px}
  header a.home:hover{background:#e2e8f0}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--dim)}
  .stamp{font-size:10.5px;color:#898781;background:#f4f3f0;border:1px solid var(--line);
    padding:2px 8px;border-radius:9px;letter-spacing:.02em}
  nav.links{margin-left:auto;display:flex;gap:6px}
  nav.links a{font-size:12px;color:#334155;text-decoration:none;background:#f1f5f9;
    border:1px solid var(--line);padding:4px 10px;border-radius:10px}
  nav.links a:hover{background:#e2e8f0}
  .authbar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .pill{background:#e8f5e9;color:#1b5e20;padding:5px 10px;border-radius:12px;font-weight:600}
  .btn{background:#334155;color:#fff;border:none;padding:6px 12px;border-radius:7px;
    cursor:pointer;font-size:12px;font-weight:600}
  .btn:hover{background:#1e293b}
  .btn.ghost{background:#fff;color:#334155;border:1px solid var(--line)}
  .btn.ghost:hover{background:#f1f5f9}
  .toolbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .toolbar input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:260px}
  .count{font-size:12px;color:var(--dim)}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#475569;cursor:pointer;user-select:none}
  .chk input{cursor:pointer}
  .hint{margin-left:auto;font-size:11.5px;color:var(--dim)}
  main{padding:14px 16px 40px}
  /* 로그인 전 화면. 표·검색·범례는 통째로 숨는다 — 받아 온 데이터도 없다. */
  #gate{max-width:430px;margin:9vh auto 0;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:22px 24px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
  #gate h2{margin:0 0 6px;font-size:17px}
  #gate p{margin:0 0 16px;font-size:12.5px;color:var(--dim);line-height:1.6}
  #gate label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:10px}
  #gate input{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;font-size:13px}
  #gate .row{display:flex;align-items:center;gap:10px;margin-top:16px}
  #gate .err{color:#b91c1c;font-size:12px;min-height:17px;margin-top:8px}
  table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;table-layout:fixed}
  th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;
    font-size:13px;line-height:1.45}
  thead th{background:#f1f5f9;font-size:12px;font-weight:700;color:#334155;white-space:nowrap;
    position:sticky;top:0;z-index:1}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{background:#e2e8f0}
  tbody tr:hover{background:#f8fafc}
  /* 열 폭 — 볼트의 dashboard-portfolio-table.css 와 같은 뜻으로 고정한다. 긴 서술 두 열이
     나머지를 밀어내지 않게 하는 것이 이 표의 가독성 전부다. */
  col.c-name{width:15%} col.c-order{width:64px} col.c-done{width:78px} col.c-grade{width:74px}
  col.c-co{width:110px} col.c-journal{width:15%} col.c-gate{width:26%} col.c-intro{width:22%}
  td.num{text-align:center;font-variant-numeric:tabular-nums}
  .name{font-weight:600}
  .repo{margin-left:5px;font-size:11px;color:#2563eb;text-decoration:none}
  .repo:hover{text-decoration:underline}
  /* VS Code 로 열기 — graph.html 의 VSCODE 버튼과 같은 일을 하는 작은 칩이다. */
  .vscode-btn{margin-left:4px;padding:0 4px;border:1px solid var(--line);border-radius:3px;
    background:#fff;color:#475569;font-size:10px;font-weight:700;line-height:15px;
    cursor:pointer;vertical-align:1px}
  .vscode-btn:hover{background:#eff6ff;border-color:#93c5fd;color:#2563eb}
  .chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:2px;border:1px solid rgba(15,23,42,.35);flex:0 0 auto}
  .journal{display:inline-flex;align-items:center;gap:5px}
  .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  tr.open .clamp{-webkit-line-clamp:unset;overflow:visible}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:0 16px 26px;font-size:11.5px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .empty{padding:22px;text-align:center;color:var(--dim)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
    padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:min(560px,92vw)}
  .toast.show{opacity:1}
  @media (max-width:1100px){
    col.c-intro,th.c-intro,td.c-intro{display:none}
    col.c-gate{width:34%}
  }
  @media (max-width:760px){
    col.c-co,th.c-co,td.c-co{display:none}
    .hint{display:none}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← 홈</a>
  <h1>포트폴리오 한눈에</h1>
  <span class="sub">등급 순 · 투고 · 다음 게이트</span>
  <span class="stamp" id="stamp" title="이 표를 볼트에서 발행한 날짜"></span>
  <nav class="links">
    <a href="mindmap.html" title="프로젝트 관계도">관계도</a>
    <a href="graph.html" title="프로젝트 그래프">그래프</a>
    <a href="upjuk.html" title="논문 리스트">논문</a>
  </nav>
  <div class="authbar" id="authbar"></div>
</header>

<div class="toolbar" id="toolbar" hidden>
  <input id="q" type="search" placeholder="검색 (프로젝트 · 투고 · 게이트 · 소개)" autocomplete="off">
  <label class="chk" title="논문 완성도 8 이상 — 점수를 매길 원고가 아직 없거나 초기 단계인 프로젝트입니다">
    <input type="checkbox" id="showAll"> 완성도 8+ 포함
  </label>
  <span class="count" id="count"></span>
  <span class="hint">읽기 전용 · 고치는 곳은 볼트의 <code>Projects/*.md</code> 와 <code>Dashboards/프로젝트현황.md</code></span>
</div>

<main>
  <section id="gate">
    <h2>로그인이 필요합니다</h2>
    <p>이 표는 연구실 내부 판정(등급 · 투고순서 · 논문 완성도)을 담고 있어 로그인한 사람에게만 보입니다.
       다른 랩 웹앱과 같은 계정을 쓰고, 한 번 로그인하면 세션을 함께 씁니다.</p>
    <label>이메일<input id="liEmail" type="email" autocomplete="username"></label>
    <label>비밀번호<input id="liPw" type="password" autocomplete="current-password"></label>
    <div class="err" id="gateErr"></div>
    <div class="row">
      <button class="btn" id="loginBtn">로그인</button>
      <a class="btn ghost" href="index.html" style="text-decoration:none">홈으로</a>
    </div>
  </section>

  <div id="view" hidden>
    <table>
      <colgroup>
        <col class="c-name"><col class="c-order"><col class="c-done"><col class="c-grade">
        <col class="c-co"><col class="c-journal"><col class="c-gate"><col class="c-intro">
      </colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty" id="empty" hidden>검색어에 걸리는 프로젝트가 없습니다.</div>
  </div>
</main>
<div class="legend" id="legend" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* ====== Supabase 설정·세션 (upjuk.html·mindmap.html 과 같은 계정·같은 localStorage 키) ======
   anon 키는 공개 값이다. 이 표를 지키는 것은 키가 아니라 RLS 이며, portfolio_rows 에는
   anon 정책이 아예 없어서 로그인 전에는 아무것도 내려오지 않는다. */
function normUrl(u){return (u||"").trim().replace(/\/+$/,"").replace(/\/rest\/v1$/i,"").replace(/\/auth\/v1$/i,"").replace(/\/+$/,"");}
const BAKED_URL="https://ijutjirouxgqcldjyhma.supabase.co";
const BAKED_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqdXRqaXJvdXhncWNsZGp5aG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDk4MDAsImV4cCI6MjA5Nzk4NTgwMH0.gIAwf6a2oY-DkTXaf5eM2L4ROMCKim5WsevGfjol7tE";
/* 쿠키·사이트 데이터가 막힌 브라우저에서는 localStorage 접근 자체가 예외를 던진다.
   그 예외가 스크립트를 통째로 죽이면 로그인 화면조차 안 뜨므로 전부 감싼다. */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let CFG={url:normUrl(lsGet("cfms_url")||BAKED_URL),key:(lsGet("cfms_key")||BAKED_KEY).trim()};
let SESSION=null;
try{ SESSION=JSON.parse(lsGet("cfms_session")||"null"); }catch(e){}
function isLoggedIn(){return !!(SESSION&&SESSION.access_token);}

let ROWS=[];       // 화면이 쓰는 행 — 아래 토글에 따라 걸러진 것
let ALL_ROWS=[];   // 표에서 받은 전부. 토글을 켜면 이쪽이 그대로 간다
let HIDDEN=0;
let 완성도포함=false;
/* 논문 완성도 8 이상은 표에서 뺀다 (2026-09-13, 사용자 지시). 완성도는 1=높음 … 10=낮음이고
   10 은 「점수를 매길 원고가 아직 없다」는 뜻이라 대부분이 여기 걸린다 — 투고를 눈앞에 둔
   원고만 남기려는 것이다. 게재 완료 행은 완성도가 숫자가 아니라 「—」 라 그대로 남는다.
   숨긴 수는 화면에 적는다. 표가 통째로 다 보이는 줄 알면 없는 프로젝트를 없다고 읽는다. */
const 완성도_상한 = 8;
let META={columns:["프로젝트","투고순서","논문 완성도","등급","공저자","투고","다음 게이트","소개"],
          blankColumns:{},stages:{},rank:{}};

let tT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3600);}

async function refreshToken(){
  if(!(SESSION&&SESSION.refresh_token)) return false;
  try{
    const r=await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',
      {method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},
       body:JSON.stringify({refresh_token:SESSION.refresh_token})});
    if(!r.ok) return false;
    const d=await r.json();
    SESSION={access_token:d.access_token,refresh_token:d.refresh_token||SESSION.refresh_token,email:SESSION.email};
    lsSet("cfms_session",JSON.stringify(SESSION));
    return true;
  }catch(e){ return false; }
}

async function api(path,opts={}){
  let res=await fetch(CFG.url+path,opts);
  // 토큰 만료(401)면 한 번 갱신하고 다시 시도한다. 그래도 안 되면 로그인 화면으로 돌아간다.
  if(res.status===401 && isLoggedIn() && /Bearer/.test((opts.headers&&opts.headers.Authorization)||"")){
    if(await refreshToken()){ opts.headers.Authorization="Bearer "+SESSION.access_token; res=await fetch(CFG.url+path,opts); }
    else { forgetSession(); throw new Error("세션이 만료되었습니다. 다시 로그인해 주세요."); }
  }
  if(!res.ok) throw new Error(res.status+" "+await res.text());
  const txt=await res.text(); return txt?JSON.parse(txt):null;
}

/* ====== 데이터 — 로그인한 사용자 토큰으로만 읽는다 ====== */
async function loadRows(){
  const data=await api('/rest/v1/portfolio_rows?select=id,kind,sort_index,data&order=sort_index',
    {headers:{apikey:CFG.key,Authorization:"Bearer "+SESSION.access_token}}) || [];
  const meta=data.find(r=>r.kind==='meta');
  if(meta&&meta.data) META=Object.assign({},META,meta.data);
  ALL_ROWS=data.filter(r=>r.kind==='row').map(r=>r.data);
  적용완성도필터();
}

/* 완성도 필터. 토글은 이 브라우저에만 기억하고(다른 사람 화면을 바꾸지 않는다),
   기본값은 꺼짐 — 투고를 눈앞에 둔 원고만 보이는 쪽이다. */
const SHOW_ALL_KEY = "cfms_portfolio_show_all_v1";
function 적용완성도필터(){
  ROWS = 완성도포함 ? ALL_ROWS.slice()
    : ALL_ROWS.filter(r=>!(typeof r.completeness==='number' && r.completeness>=완성도_상한));
  HIDDEN = ALL_ROWS.length - ROWS.length;
}

const 빈값 = "—";
const 한글순 = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "ko");
const QUALITY_COLORS = {"상":"var(--q-high)","중":"var(--q-medium)","하":"var(--q-low)",
  "ToDo":"var(--q-todo)","Closed":"var(--q-closed)","그룹":"var(--q-group)","등급 없음":"var(--q-none)"};

/* 볼트의 빈값열은 필드를 한국어 이름으로 가리킨다. 발행된 JSON 의 키로 옮긴다. */
const BLANK_FIELD = {순서:"order", 완성도:"completeness", 등급:"grade", 공저자키:"coauthorKey", 투고:"journal"};

/* ── 정렬 — 볼트 dataviewjs 의 정렬기·비교() 를 그대로 옮긴 것이다 ──────────
   저쪽을 고치면 이쪽도 같이 고친다(발행해도 따라오지 않는 유일한 부분이다).
   미기입(—)은 방향과 무관하게 늘 맨 아래에 남고, 게재 완료 행은 「투고순서」·「논문
   완성도」 두 열에서 방향과 무관하게 맨 위에 모인다. */
const 수 = v => (Number.isFinite(v) ? v : Infinity);
const 정렬기 = {
  0: (a, b) => 한글순(a.name, b.name),
  1: (a, b) => 수(a.orderKey) - 수(b.orderKey) || a.bucket - b.bucket || 한글순(a.name, b.name),
  2: (a, b) => 수(a.completenessKey) - 수(b.completenessKey) || 한글순(a.name, b.name),
  3: (a, b) => a.bucket - b.bucket || 한글순(a.workspace, b.workspace) || 한글순(a.name, b.name),
  4: (a, b) => 한글순(a.coauthorKey, b.coauthorKey) || 한글순(a.name, b.name),
  5: (a, b) => 수(a.stageRank) - 수(b.stageRank) || 한글순(a.journal, b.journal) || 한글순(a.name, b.name),
};

const SORT_KEY = "cfms_portfolio_sort_v1";
let 현재열 = 2;      // 볼트 노트의 기본값과 같다
let 역순 = false;
try {
  const saved = JSON.parse(lsGet(SORT_KEY) || "null");
  if (saved && 정렬기[saved.col]) { 현재열 = saved.col; 역순 = !!saved.desc; }
} catch (e) { /* 사생활 보호 모드 등 — 기본값으로 간다 */ }

function 비교(a, b) {
  if ((현재열 === 1 || 현재열 === 2) && a.published !== b.published) return a.published ? -1 : 1;
  const field = BLANK_FIELD[META.blankColumns && META.blankColumns[현재열]];
  if (field) {
    const ea = a[field] === 빈값 || a[field] == null || a[field] === "";
    const eb = b[field] === 빈값 || b[field] == null || b[field] === "";
    if (ea !== eb) return ea ? 1 : -1;
  }
  const c = 정렬기[현재열](a, b);
  return 역순 ? -c : c;
}

/* 투고 아이콘의 색은 단계가 아니라 **논문 등급**이다 (2026-09-13). graph.html 이 노드 원과
   진도 배지를 하나로 합치면서 「채운 정도 = 투고 진도, 색 = 논문 등급」이 되었고, 볼트
   대시보드와 이 표도 같은 눈으로 읽히게 맞췄다. 값은 graph.html 의 QUALITY_COLORS 와 같다 —
   여기서는 SVG 속성에 들어가므로 CSS 변수가 아니라 실제 색이어야 한다.
   ToDo 는 원래 흰색인데 흰 바탕에서 안 보여 회색으로 둔다. */
const QUALITY_PIE = {"상":"#e02020","중":"#f28e2b","하":"#2a78d6","ToDo":"#9ca3af",
  "Closed":"#6b7280","그룹":"#c8c8c8","등급 없음":"#94a3b8"};
const 파이색 = g => QUALITY_PIE[g] || "#94a3b8";

/* ── 투고 파이 아이콘 — 볼트 노트의 투고셀() 과 같은 기하다(r=6, 12시에서 시계방향).
   단계(채운 정도)와 설명은 META.stages 로 볼트에서 따라오고, 색은 호출부가 준다. */
function 파이(stage, color) {
  const s = META.stages && META.stages[stage];
  if (!s) return "";
  const r = 6, cx = 8, cy = 8, c = color || s.color;
  let 안 = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  if (s.done) {
    안 = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`
       + `<path d="M${cx - 2.9},${cy + 0.2} l2.1,2.2 l3.9,-4.4" fill="none" stroke="#fff"`
       + ` stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (s.xx) {
    안 += `<path d="M${cx - 3.2},${cy + 3.2} L${cx + 3.2},${cy - 3.2}" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`
        + `<path d="M${cx - 3.2},${cy - 3.2} L${cx + 3.2},${cy + 3.2}" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`;
  } else if (s.x) {
    안 += `<path d="M${cx - 3.2},${cy + 3.2} L${cx + 3.2},${cy - 3.2}" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`;
  } else if (s.frac > 0) {
    const a = 2 * Math.PI * s.frac;
    const ex = cx + r * Math.sin(a), ey = cy - r * Math.cos(a), big = s.frac > 0.5 ? 1 : 0;
    안 += `<path d="M${cx},${cy} L${cx},${cy - r} A${r},${r} 0 ${big} 1 ${ex},${ey} Z" fill="${c}"/>`;
  }
  return `<svg viewBox="0 0 16 16" width="14" height="14" style="flex:0 0 auto">${안}</svg>`;
}

const esc = v => String(v ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function 행그리기(row) {
  const tr = document.createElement("tr");
  const stage = META.stages && META.stages[row.stage];
  const 저장소 = row.repo
    ? `<a class="repo" href="${esc(row.repo)}" target="_blank" rel="noopener" title="저장소 열기">↗</a>` : "";
  const 브이에스 = row.projectPath
    ? `<button type="button" class="vscode-btn" data-path="${esc(row.projectPath)}"`
      + ` title="VS Code 새 창으로 열기 — ${esc(row.projectPath)}">VS</button>` : "";
  tr.innerHTML =
      `<td><span class="name">${esc(row.name)}</span>${저장소}${브이에스}</td>`
    + `<td class="num">${esc(row.order)}</td>`
    + `<td class="num">${esc(row.completeness)}</td>`
    + `<td><span class="chip"><span class="dot" style="background:${QUALITY_COLORS[row.grade] || "var(--q-none)"}"></span>${esc(row.grade)}</span></td>`
    + `<td class="c-co">${esc(row.coauthor)}</td>`
    + `<td><span class="journal" title="${esc((stage ? stage.label : "") + (row.grade ? ` · 등급 ${row.grade}` : ""))}">${파이(row.stage, 파이색(row.grade))}<span>${esc(row.journal)}</span></span></td>`
    + `<td><div class="clamp" title="${esc(row.gate)}">${esc(row.gate)}</div></td>`
    + `<td class="c-intro"><div class="clamp" title="${esc(row.intro)}">${esc(row.intro)}</div></td>`;
  // 긴 서술 두 열은 3줄에서 자른다. 줄을 누르면 그 행만 펼친다.
  // ↗·VS 는 여기서 걸러 낸다 — 이 핸들러가 tbody 의 위임 핸들러보다 먼저 버블을 받으므로
  // 저쪽에서 stopPropagation 을 해도 이미 늦다(그래서 링크를 눌러도 행이 펼쳐졌다).
  tr.addEventListener("click", (event) => {
    if (event.target.closest("a.repo, .vscode-btn")) return;
    tr.classList.toggle("open");
  });
  return tr;
}

function 머리그리기() {
  const head = document.getElementById("head");
  head.textContent = "";
  (META.columns || []).forEach((label, i) => {
    const th = document.createElement("th");
    if (i === 7) th.className = "c-intro";
    if (i === 4) th.className = "c-co";
    if (정렬기[i]) {
      th.classList.add("sortable");
      const 선택됨 = i === 현재열;
      th.textContent = 선택됨 ? `${label} ${역순 ? "▼" : "▲"}` : label;
      th.title = `클릭 — ${label} ${선택됨 && !역순 ? "내림차순" : "오름차순"}으로 정렬`;
      th.addEventListener("click", () => {
        if (i === 현재열) 역순 = !역순; else { 현재열 = i; 역순 = false; }
        lsSet(SORT_KEY, JSON.stringify({ col: 현재열, desc: 역순 }));
        그리기();
      });
    } else {
      th.textContent = label;
      th.title = "긴 서술이라 정렬 대상이 아니다 (볼트 표와 같다)";
    }
    head.appendChild(th);
  });
}

function 걸러내기() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return ROWS;
  return ROWS.filter(r => [r.name, r.grade, r.coauthor, r.journal, r.gate, r.intro, r.workspace]
    .join(" ").toLowerCase().includes(q));
}

function 그리기() {
  머리그리기();
  const rows = 걸러내기().slice().sort(비교);
  const body = document.getElementById("body");
  body.textContent = "";
  for (const row of rows) body.appendChild(행그리기(row));
  document.getElementById("empty").hidden = rows.length > 0;
  const count = document.getElementById("count");
  const 숨김 = HIDDEN ? ` · 완성도 ${완성도_상한}+ ${HIDDEN}개 숨김` : "";
  count.textContent =
    (rows.length === ROWS.length ? `${ROWS.length}개` : `${rows.length} / ${ROWS.length}개`) + 숨김;
  count.title = HIDDEN
    ? `논문 완성도 ${완성도_상한} 이상(원고가 아직 없거나 초기 단계)인 ${HIDDEN}개는 표에서 뺐습니다. 볼트에는 그대로 있습니다.`
    : "";
}

function 범례() {
  const box = document.getElementById("legend");
  const 단계들 = Object.entries(META.stages || {})
    .sort((a, b) => ((META.rank && META.rank[a[0]]) ?? 99) - ((META.rank && META.rank[b[0]]) ?? 99));
  // 범례 아이콘은 회색이다 — 색은 단계가 아니라 등급이 정하므로, 여기서 색을 쓰면 거짓말이 된다.
  box.innerHTML = 단계들.map(([id, s]) => `<span>${파이(id, "#94a3b8")}${esc(s.label)}</span>`).join("")
    + `<span style="margin-left:14px">채운 정도 = 투고 진도 · 색 = 논문 등급</span>`
    + `<span style="margin-left:auto">— 는 미기입 (정렬에서 늘 맨 아래)</span>`;
}

/* ====== 로그인 / 로그아웃 ====== */
function renderAuthbar(){
  const bar=document.getElementById('authbar');
  bar.innerHTML = isLoggedIn()
    ? `<span class="pill">✔ ${esc(SESSION.email||"")}</span> <button class="btn ghost" id="logoutBtn">로그아웃</button>`
    : `<span>로그인 필요</span>`;
  const out=document.getElementById('logoutBtn');
  if(out) out.addEventListener('click', logout);
}

function forgetSession(){
  SESSION=null;
  lsDel("cfms_session");
  showGate();
}

function showGate(){
  ROWS=[];                                   // 화면만 가리는 게 아니라 들고 있던 값도 버린다
  document.getElementById('gate').hidden=false;
  document.getElementById('view').hidden=true;
  document.getElementById('toolbar').hidden=true;
  document.getElementById('legend').hidden=true;
  document.getElementById('stamp').textContent='';
  document.getElementById('body').textContent='';
  renderAuthbar();
}

async function showTable(){
  document.getElementById('gate').hidden=true;
  document.getElementById('view').hidden=false;
  document.getElementById('toolbar').hidden=false;
  document.getElementById('legend').hidden=false;
  renderAuthbar();
  const stamp=document.getElementById('stamp');
  stamp.textContent='읽는 중…';
  try{
    await loadRows();
  }catch(e){
    stamp.textContent='';
    if(/portfolio_rows|PGRST205|schema cache|42P01/i.test(e.message)){
      toast('portfolio_rows 표가 아직 없습니다. schema_portfolio_rows.sql 을 돌린 뒤 발행해 주세요.');
    }else{
      toast('표를 읽지 못했습니다: '+e.message.slice(0,90));
    }
    return;
  }
  stamp.textContent = META.builtOn ? `볼트 ${META.builtOn}` : '';
  stamp.title = `${META.source || '볼트'} 에서 ${META.builtOn || ''} 에 발행`;
  if(!ROWS.length) toast('받은 행이 없습니다. node scripts/publish-portfolio.mjs --push 로 발행해 주세요.');
  범례();
  그리기();
}

async function login(){
  const email=document.getElementById('liEmail').value.trim();
  const pw=document.getElementById('liPw').value;
  const err=document.getElementById('gateErr');
  err.textContent='';
  if(!email||!pw){ err.textContent='이메일과 비밀번호를 입력하세요.'; return; }
  try{
    const r=await api('/auth/v1/token?grant_type=password',
      {method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},
       body:JSON.stringify({email,password:pw})});
    SESSION={access_token:r.access_token,refresh_token:r.refresh_token,email};
    lsSet("cfms_session",JSON.stringify(SESSION));
    document.getElementById('liPw').value='';
    await showTable();
  }catch(e){ err.textContent='로그인 실패 — 이메일/비밀번호를 확인하세요.'; }
}

function logout(){
  forgetSession();
  toast('로그아웃되었습니다.');
}

/* VS Code 열기 — graph.html 과 같은 규칙이다. OS 에 등록된 vscode:// 처리기로 폴더를 새 창에
   연다. 경로는 볼트 노트의 path: 이고, 여기서 셸 명령을 만들지 않는다. 그 처리기가 없는
   컴퓨터(남의 브라우저)에서는 아무 일도 일어나지 않는다.
   ↗·VS 클릭이 행 펼치기까지 건드리지 않도록 여기서 전파를 끊는다. */
document.getElementById('body').addEventListener('click', e => {
  if (e.target.closest('a.repo')) { e.stopPropagation(); return; }
  const btn = e.target.closest('.vscode-btn');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const projectPath = btn.dataset.path;
  if (!projectPath) return;
  const normalized = projectPath.replace(/\\/g, '/').replace(/\/+$/, '');
  window.open('vscode://file/' + encodeURI(normalized) + '/?windowId=_blank', '_blank', 'noopener');
});

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('liPw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.getElementById('liEmail').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.getElementById('q').addEventListener('input', 그리기);

/* 완성도 8+ 토글 — 켜면 표에서 받은 행이 전부 보인다. 선택은 이 브라우저에만 남는다. */
const showAll = document.getElementById('showAll');
완성도포함 = lsGet(SHOW_ALL_KEY) === '1';
showAll.checked = 완성도포함;
showAll.addEventListener('change', () => {
  완성도포함 = showAll.checked;
  lsSet(SHOW_ALL_KEY, 완성도포함 ? '1' : '0');
  적용완성도필터();
  그리기();
});

if(isLoggedIn()) showTable(); else showGate();
</script>
