const YEAR0 = 2002, XSCALE = 95;
const BAND = { garment: -760, "3dp": -180, imaging: 330, materials: 640, smart: 1000, mfg: 1150, patent: 1300 };
function timelinePositions() {
  const pos = {};
  const stack = {};   // comm|year → count
  PAPERS.forEach(p => {
    const key = p.comm + "|" + p.y;
    const k = stack[key] = (stack[key] || 0) + 1;
    pos[p.id] = { x: (p.y - YEAR0) * XSCALE, y: BAND[p.comm] + (k - 1) * 62 };
  });
  const px = (2029 - YEAR0) * XSCALE;
  PROJECTS.forEach((p, i) => {
    pos[p.id] = { x: px + (i % 2) * 260, y: -760 + Math.floor(i / 2) * 92 };
  });
  return pos;
}
const yearLabelIds = [];
(function addYearLabels() {
  const years = [...new Set(PAPERS.map(p => p.y))].sort();
  years.forEach(y => {
    const id = "year_" + y;
    yearLabelIds.push(id);
    nodesDS.add({ id, shape: "text", label: String(y), physics: false, chosen: false,
                  font: { size: 20, color: "#bbbbbb" }, x: (y - YEAR0) * XSCALE, y: -850, fixed: true, _kind: "label" });
  });
  const id = "year_proj";
  yearLabelIds.push(id);
  nodesDS.add({ id, shape: "text", label: "진행 중 (2026–)", physics: false, chosen: false,
                font: { size: 20, color: "#bbbbbb" }, x: (2029 - YEAR0) * XSCALE + 130, y: -850, fixed: true, _kind: "label" });
})();

const container = document.getElementById("graph");
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  interaction: { hover: true, tooltipDelay: 120 },
  physics: false,
  edges: { selectionWidth: 1.5 }
});

function applyTimeline() {
  const pos = timelinePositions();
  const updates = [];
  for (const id in pos) updates.push({ id, x: pos[id].x, y: pos[id].y, fixed: { x: true, y: true }, physics: false });
  yearLabelIds.forEach(id => updates.push({ id, hidden: false }));
  network.setOptions({ physics: false });
  nodesDS.update(updates);
  network.fit({ animation: false });
}
function applyPhysics() {
  const updates = [];
  nodesDS.forEach(n => { if (n._kind !== "label") updates.push({ id: n.id, fixed: false, physics: true }); });
  yearLabelIds.forEach(id => updates.push({ id, hidden: true }));
  nodesDS.update(updates);
  network.setOptions({ physics: {
    enabled: true,
    barnesHut: { gravitationalConstant: -5500, springLength: 140, springConstant: 0.02, avoidOverlap: 0.4 },
    stabilization: { iterations: 400 },
    minVelocity: 0.75
  }});
  // 안정화가 끝나면 물리를 꺼서 노드가 계속 떠다니지 않게 한다
  network.once("stabilizationIterationsDone", () => {
    if (document.getElementById("layout-sel").value !== "physics") return;
    network.setOptions({ physics: false });
    network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
  });
}
document.getElementById("layout-sel").addEventListener("change", e => {
  if (e.target.value === "timeline") applyTimeline(); else applyPhysics();
});

    if (ev.target.classList.contains("legend-cb")) return;
    const cb = item.querySelector(".legend-cb");
    cb.checked = !cb.checked;
    toggleCommunity(key, !cb.checked);
  });
  legendDiv.appendChild(item);
});
function toggleCommunity(key, hide) {
  if (hide) hiddenComms.add(key); else hiddenComms.delete(key);
  const updates = [];
  rawNodes.forEach(n => updates.push({ id: n.id, hidden: hiddenComms.has(n._comm) }));
  nodesDS.update(updates);
  document.querySelectorAll(".legend-item").forEach(el => {
    el.classList.toggle("dimmed", hiddenComms.has(el.dataset.comm));
  });
  syncSelectAll();
  refreshEdgeVisibility();
}
function toggleAllCommunities(hide) {
  document.querySelectorAll(".legend-item .legend-cb").forEach(cb => cb.checked = !hide);
  Object.keys(COMMS).forEach(k => { if (hide) hiddenComms.add(k); else hiddenComms.delete(k); });
  const updates = [];
  rawNodes.forEach(n => updates.push({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  document.querySelectorAll(".legend-item").forEach(el => el.classList.toggle("dimmed", hide));
  syncSelectAll();
}
function syncSelectAll() {
  const cb = document.getElementById("select-all-cb");
  const total = Object.keys(COMMS).length, off = hiddenComms.size;
  cb.checked = off === 0;
  cb.indeterminate = off > 0 && off < total;
}

// ============================================================
// 엣지 종류 토글
// ============================================================
const edgeVisible = { cite: true, lineage: true, rel: true, dep: true };
function refreshEdgeVisibility() {
  const updates = [];
  rawEdges.forEach(e => updates.push({ id: e.id, hidden: !edgeVisible[e._type] }));
  edgesDS.update(updates);
}
document.getElementById("cite-cb").addEventListener("change", e => { edgeVisible.cite = e.target.checked; refreshEdgeVisibility(); });
document.getElementById("lineage-cb").addEventListener("change", e => { edgeVisible.lineage = e.target.checked; refreshEdgeVisibility(); });
document.getElementById("rel-cb").addEventListener("change", e => { edgeVisible.rel = e.target.checked; refreshEdgeVisibility(); });
document.getElementById("dep-cb").addEventListener("change", e => { edgeVisible.dep = e.target.checked; refreshEdgeVisibility(); });

// ============================================================
// 노드 정보 패널 (이웃 논문 hypertext 링크)
// ============================================================
const infoContent = document.getElementById("info-content");
function neighborRows(id) {
  const rows = [];
  CITES.forEach(([a,b]) => {
    if (a === id) rows.push({ other: b, rel: "인용함 →" });
    if (b === id) rows.push({ other: a, rel: "← 피인용" });
  });
  LINEAGE.forEach(([a,b,why]) => {
    if (a === id) rows.push({ other: b, rel: "계보 →", why });
    if (b === id) rows.push({ other: a, rel: "← 계보", why });
  });
  RELATED.forEach(([a,b,why,w]) => {
    const tag = w ? "관련(약)" : "관련";
    if (a === id) rows.push({ other: b, rel: tag + " →", why });
    if (b === id) rows.push({ other: a, rel: "← " + tag, why });
  });
  DEPENDS.forEach(([a,b,rel]) => {
    if (a === id) rows.push({ other: b, rel: "의존 → (" + rel + ")" });
    if (b === id) rows.push({ other: a, rel: "← 의존 (" + rel + ")" });
  });
  return rows;
}
function showNode(id) {
  const paper = paperById[id], proj = projById[id];
  if (!paper && !proj) return;
  let html = "";
  if (paper) {
    const c = COMMS[paper.comm];
    html += '<div class="field"><b>' + esc(id) + '</b> (' + paper.y + ')</div>';
    html += '<div class="field">' + esc(paper.t) + '</div>';
    html += '<div class="field"><b>저널:</b> ' + esc(paper.j) + '</div>';
    html += '<div class="field"><b>계보:</b> <span style="color:' + c.color + '">●</span> ' + esc(c.label) + '</div>';
    html += '<div class="field"><b>자기 인용:</b> 피인용 ' + (citeIn[id] || 0) + ' · 인용 ' + (citeOut[id] || 0) + '</div>';
    const nf = NOTE_FILES[id];
    if (nf) {
      const uri = "obsidian://open?vault=" + encodeURIComponent(OBSIDIAN_VAULT) + "&file=" + encodeURIComponent(nf);
      html += '<div class="field"><a href="' + uri + '">Obsidian 노트 열기</a></div>';
    }
  } else {
    html += '<div class="field"><b>' + esc(id) + '</b> — 진행 중 연구 (' + esc(proj.g) + ')</div>';
    html += '<div class="field">' + esc(proj.intro) + '</div>';
    html += '<div class="field" style="color:#777">' + esc(proj.note) + '</div>';
  }
  const rows = neighborRows(id);
  if (rows.length) {
    html += '<div class="field" style="margin-top:8px"><b>연결 (' + rows.length + ')</b></div><div id="neighbors-list">';
    rows.forEach(r => {
      const other = paperById[r.other] || projById[r.other];
      const commKey = paperById[r.other] ? paperById[r.other].comm : "project";
      const color = paperById[r.other] ? COMMS[commKey].color : GRADE_BORDER[projById[r.other].g];
      const name = paperById[r.other] ? r.other + " · " + trunc(paperById[r.other].t, 28) : r.other;
      html += '<span class="neighbor-link" style="border-left-color:' + color + '" data-id="' + esc(r.other) + '" title="' +
              esc(r.rel + (r.why ? " — " + r.why : "")) + '">' +
              '<span style="color:#999">' + esc(r.rel) + '</span> ' + esc(name) + '</span>';
    });
    html += '</div>';
  }
  infoContent.innerHTML = html;
  infoContent.querySelectorAll(".neighbor-link").forEach(el => {
    el.addEventListener("click", () => focusNode(el.dataset.id));
  });
}
function focusNode(id) {
  network.selectNodes([id]);
  network.focus(id, { scale: 0.9, animation: { duration: 400, easingFunction: "easeInOutQuad" } });
  showNode(id);
}
network.on("click", params => {
  if (params.nodes.length && !String(params.nodes[0]).startsWith("year_")) showNode(params.nodes[0]);
});

// ============================================================
// 검색
// ============================================================
const searchInput = document.getElementById("search");
const searchResults = document.getElementById("search-results");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = "none"; searchResults.innerHTML = ""; return; }
  const hits = [];
  PAPERS.forEach(p => { if ((p.id + " " + p.t + " " + p.j).toLowerCase().includes(q)) hits.push({ id: p.id, label: p.id + " · " + p.t }); });
  PROJECTS.forEach(p => { if ((p.id + " " + p.intro).toLowerCase().includes(q)) hits.push({ id: p.id, label: p.id + " · " + p.intro }); });
  searchResults.innerHTML = hits.slice(0, 30).map(h =>
    '<div class="search-item" data-id="' + esc(h.id) + '">' + esc(trunc(h.label, 60)) + '</div>').join("");
  searchResults.style.display = hits.length ? "block" : "none";
  searchResults.querySelectorAll(".search-item").forEach(el => {
    el.addEventListener("click", () => { focusNode(el.dataset.id); searchResults.style.display = "none"; });
  });
});

// 통계
// ============================================================
document.getElementById("stats-text").textContent =
  PAPERS.length + "편 발표 논문 (IJ 37 · DJ 27 · JASR 1) + 진행 중 " + PROJECTS.length + "건 · 엣지 " +
  rawEdges.length + "개 (인용 " + CITES.length + " · 계보 " + LINEAGE.length + " · 관련 " + RELATED.length + " · 의존 " + DEPENDS.length + ")";
</script>
