    const zSlider = document.getElementById('zScale');

    const labelsToggle = document.getElementById('labelsToggle');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020617, 0.00115);
    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 5000);

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    controls.dampingFactor = 0.075;
    controls.minDistance = 90;
    controls.maxDistance = 2400;
    controls.screenSpacePanning = true;

    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x172033, 1.45));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);

    const rimLight = new THREE.DirectionalLight(0x67e8f9, 0.65);
    rimLight.position.set(-500, -180, -220);
    scene.add(rimLight);

    const gridGroup = new THREE.Group();
    const edgeGroup = new THREE.Group();
    const hyperGroup = new THREE.Group();
    const depGroup = new THREE.Group();
    scene.add(gridGroup, edgeGroup, hyperGroup, depGroup);

    const posValues = Object.values(POS);
    const centerX = posValues.reduce((sum, p) => sum + p.x, 0) / posValues.length;

    const nodeMeshes = new Map();

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let selected = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function nodeColor(node) {

      return Number.isFinite(Number(node._level)) ? Number(node._level) : 0;
    }

    function basePosition(node, zScale = Number(zSlider.value)) {
      const p = POS[node.id];
      return new THREE.Vector3(
        (p.x - centerX) * XY_SCALE,
        -(p.y - centerY) * XY_SCALE,
        (levelOf(node) - LEVEL_CENTER) * zScale,
      );
    }

    function readSavedPositions() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; }
      catch { return {}; }
    }

    function savePositions() {
      const saved = {};
      nodeMeshes.forEach((mesh, id) => {
        saved[id] = { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z };

      try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch { /* storage is optional */ }
    }

    function disposeGroup(group) {
      while (group.children.length) {
        const child = group.children[0];
        group.remove(child);
        child.traverse((object) => {
          object.geometry?.dispose?.();
          if (Array.isArray(object.material)) object.material.forEach((m) => m.dispose?.());
          else object.material?.dispose?.();
        });
      }
    }

    function addLine(group, a, b, color, opacity = 0.55, dashed = false, widthHint = 1) {
      const geometry = new THREE.BufferGeometry().setFromPoints([a, b]);
      const material = dashed
        ? new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 10 * widthHint, gapSize: 7 })
        : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      const line = new THREE.Line(geometry, material);
      if (dashed) line.computeLineDistances();
      group.add(line);
      return line;
    }

      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      if (length < 1) return;
      direction.normalize();
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(3.2, 9, 12),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity }),
      );
      cone.position.copy(a).addScaledVector(direction, Math.max(0, length - 12));
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
      group.add(cone);
    }

        addArrow(edgeGroup, a, b, color, 0.68);
      });

        const volume = new THREE.Mesh(geometry, material);
        volume.position.copy(center);

          new THREE.LineBasicMaterial({ color, transparent: true, opacity: Number(hyperedge.strokeAlpha ?? 0.55) }),
        );
        outline.position.copy(center);

        labelEl.className = 'hyper-label';
        labelEl.style.color = hyperedge.labelColor || hyperColor(hyperedge);

        const color = dep.style === 'contrast' ? '#d6d39a' : '#a5b4fc';

        if (label) label.style.display = visible ? '' : 'none';

      rebuildEdges();
      rebuildHyperedges();

    function showNodeInfo(node) {

    function selectNode(mesh) {
      if (selected) {

        nodeLabels.get(selected.userData.node.id)?.classList.add('selected');

    function focusNode(mesh) {
      if (!mesh) return;

      const target = mesh.position.clone();
      const direction = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
      controls.target.copy(target);
      camera.position.copy(target).addScaledVector(direction.lengthSq() ? direction : new THREE.Vector3(.25,.2,1), 235);
      controls.update();
    }

    function runSearch() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      if (!query) return;
      const candidates = RAW_NODES.filter((node) => node.id.toLocaleLowerCase().includes(query) || node.label.toLocaleLowerCase().includes(query));
      const exact = candidates.find((node) => node.id.toLocaleLowerCase() === query || node.label.toLocaleLowerCase() === query);
      const found = exact || candidates[0];
      if (!found) {
        searchInput.setCustomValidity('일치하는 프로젝트가 없습니다.');
        searchInput.reportValidity();
        return;
      }
      searchInput.setCustomValidity('');
      gradeFilter.value = 'all';
      applyVisibility();
      focusNode(nodeMeshes.get(found.id));

      const visible = [...nodeMeshes.values()].filter((mesh) => mesh.visible);

      const box = new THREE.Box3().setFromPoints(visible.map((mesh) => mesh.position));
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxSize = Math.max(size.x, size.y, size.z, 220);
      const distance = Math.min(1800, Math.max(420, maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.28));
      const direction = new THREE.Vector3(.23, .16, 1).normalize();
      controls.target.copy(center);
      camera.position.copy(center).addScaledVector(direction, distance);
      camera.near = Math.max(.1, distance / 1000);
      camera.far = Math.max(5000, distance * 5);
      camera.updateProjectionMatrix();
      controls.update();
    }

      rebuildLevelGrids();
      rebuildEdges();
      rebuildHyperedges();
      savePositions();
    }

    const dragControls = new DragControls([...nodeMeshes.values()], camera, renderer.domElement);
    dragControls.addEventListener('dragstart', () => { controls.enabled = false; dragged = false; });
    dragControls.addEventListener('drag', () => { dragged = true; rebuildEdges(); rebuildHyperedges(); });
    dragControls.addEventListener('dragend', () => { controls.enabled = true; savePositions(); setTimeout(() => { dragged = false; }, 0); });

    renderer.domElement.addEventListener('pointermove', (event) => {
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects([...nodeMeshes.values()].filter((mesh) => mesh.visible), false)[0];
      renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
    });
    renderer.domElement.addEventListener('click', (event) => {
      if (dragged) return;
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects([...nodeMeshes.values()].filter((mesh) => mesh.visible), false)[0];
      selectNode(hit?.object || null);
    });

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    searchInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') runSearch(); });
    gradeFilter.addEventListener('change', applyVisibility);
    zSlider.addEventListener('input', updateDepth);
    labelsToggle.addEventListener('change', () => { labelsRoot.style.display = labelsToggle.checked ? 'block' : 'none'; });
    hyperToggle.addEventListener('change', rebuildHyperedges);
    document.getElementById('resetCamera').addEventListener('click', resetCamera);
    document.getElementById('resetLayout').addEventListener('click', () => {
      try { localStorage.removeItem(STORE_KEY); } catch { /* storage is optional */ }
      RAW_NODES.forEach((node) => nodeMeshes.get(node.id).position.copy(basePosition(node)));
      rebuildLevelGrids(); rebuildEdges(); rebuildHyperedges(); resetCamera();
    });
    document.getElementById('closeInfo').addEventListener('click', () => selectNode(null));
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });

    const grades = ['상', '중', '하', 'ToDo', 'Closed'];
    const gradeColors = {};
    RAW_NODES.forEach((node) => { gradeColors[node._grade || node._quality] ||= nodeColor(node); });
    const legend = document.getElementById('legend');
    grades.forEach((grade) => {
      const count = RAW_NODES.filter((node) => (node._grade || node._quality) === grade).length;
      if (!count) return;
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<span class="dot" style="color:${escapeHtml(gradeColors[grade] || '#94a3b8')};background:currentColor"></span>${escapeHtml(grade)} ${count}`;
      legend.appendChild(chip);
    });

    rebuildLevelGrids();
    rebuildEdges();
    rebuildHyperedges();
    resetCamera();
    loading.classList.add('hidden');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();
    console.info(`graph3d ready: ${RAW_NODES.length} nodes, ${RAW_EDGES.length} edges, ${HYPEREDGES.length} hyperedges, source ${SOURCE_SHA.slice(0, 12)}`);
  </script>
